
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BloxGo Game</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eaf4ff;font-family:Arial,sans-serif}
#game{width:100%;height:100%;display:block;touch-action:none}

#bloxgoMenuButton{
 position:fixed;top:14px;left:14px;width:46px;height:46px;
 padding:0;border:1px solid #ffffffaa;border-radius:13px;
 background:#ffffffdd;box-shadow:0 4px 15px #0002;
 display:flex;align-items:center;justify-content:center;
 z-index:1000;cursor:pointer
}
#bloxgoMenuButton img{width:30px;height:30px;object-fit:contain}

#mobileControls{
 display:none;position:fixed;left:20px;right:20px;bottom:22px;
 justify-content:space-between;align-items:end;z-index:1000;
 pointer-events:none
}
#stick{
 width:112px;height:112px;border-radius:50%;
 background:#8dbcf477;border:2px solid white;
 position:relative;pointer-events:auto;touch-action:none
}
#nub{
 width:44px;height:44px;border-radius:50%;
 background:#287de8;position:absolute;left:32px;top:32px
}
#jump{
 width:78px;height:78px;border-radius:50%;
 background:#2378e8;color:white;border:0;
 font-weight:bold;pointer-events:auto;touch-action:none
}
@media(pointer:coarse) and (hover:none){
 #mobileControls{display:flex}
}
@media(pointer:fine){
 #mobileControls{display:none!important}
}
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
 }
}
</script>
</head>

<body>

<canvas id="game"></canvas>

<button id="bloxgoMenuButton" aria-label="Menu">
 <img src="Content/bloxgo_menu.png" alt="">
</button>

<div id="mobileControls">
 <div id="stick"><div id="nub"></div></div>
 <button id="jump">JUMP</button>
</div>

<script type="module">

import * as THREE from "three";
import {OBJLoader} from "three/addons/loaders/OBJLoader.js";

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
 getFirestore,
 doc,
 getDoc
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={
 apiKey:"AIzaSyBui_UWCNABfF3wBYBMzi6Q5dLGvykfhaM",
 authDomain:"bloxgo-data.firebaseapp.com",
 projectId:"bloxgo-data",
 storageBucket:"bloxgo-data.firebasestorage.app",
 messagingSenderId:"905482130911",
 appId:"1:905482130911:web:273e391163a595ca32606a",
 measurementId:"G-4WYW9MNZ6Z"
};

const firebaseApp=initializeApp(firebaseConfig);
const db=getFirestore(firebaseApp);


/* MENU */

document.getElementById("bloxgoMenuButton").onclick=()=>{
 location.href="index.html";
};


/* THREE.JS */

const canvas=document.getElementById("game");

const renderer=new THREE.WebGLRenderer({
 canvas,
 antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;

let scene=new THREE.Scene();
scene.background=new THREE.Color(0xeaf4ff);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,.1,1000
);

camera.position.set(7,6,9);

scene.add(new THREE.HemisphereLight(
 0xffffff,0x9bb6d4,2
));

const sunlight=new THREE.DirectionalLight(
 0xffffff,2
);

sunlight.position.set(8,15,8);
sunlight.castShadow=true;
scene.add(sunlight);


/* DEFAULT FLOOR */

function createDefaultFloor(){

 const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(1000,1000),
  new THREE.MeshStandardMaterial({color:0xf7fbff})
 );

 floor.rotation.x=-Math.PI/2;
 floor.position.y=-.05;
 floor.name="BloxGoDefaultFloor";
 floor.receiveShadow=true;

 scene.add(floor);

}

createDefaultFloor();


/* GAME LOADING */

const params=new URLSearchParams(location.search);
const gameId=params.get("id");

let collisionObjects=[];

function rebuildCollisionObjects(){

 collisionObjects=[];

 scene.updateMatrixWorld(true);

 scene.traverse(object=>{

  if(!object.isMesh || !object.visible)return;

  if(object.name==="BloxGoDefaultFloor")return;

  const bounds=new THREE.Box3().setFromObject(object);

  if(bounds.isEmpty())return;

  const size=new THREE.Vector3();
  bounds.getSize(size);

  // Large floor-like objects are not wall colliders.
  if(size.x>200 || size.z>200)return;

  collisionObjects.push({
   object,
   bounds
  });

 });

}

async function loadGame(){

 if(!gameId)return;

 try{

  const snapshot=await getDoc(
   doc(db,"publishedGames",gameId)
  );

  if(!snapshot.exists()){
   console.error("Game not found");
   return;
  }

  const data=snapshot.data();

  if(data.scene){

   const loader=new THREE.ObjectLoader();
   const loadedScene=loader.parse(data.scene);

   // Replace the default world with the published world.
   scene=loadedScene;

   scene.traverse(object=>{

    if(object.isMesh){
     object.castShadow=true;
     object.receiveShadow=true;
    }

   });

   let hasLight=false;

   scene.traverse(object=>{
    if(object.isLight)hasLight=true;
   });

   if(!hasLight){

    scene.add(new THREE.HemisphereLight(
     0xffffff,0x9bb6d4,2
    ));

    const light=new THREE.DirectionalLight(0xffffff,2);
    light.position.set(8,15,8);
    scene.add(light);

   }

   rebuildCollisionObjects();

  }

  document.title=data.title||"BloxGo Game";

 }catch(error){

  console.error("Game loading failed:",error);

 }

}


/* PLAYER */

let player=null;
let leftArm=null;
let rightArm=null;
let leftLeg=null;
let rightLeg=null;

const playerHeight=3.3;
const hitboxWidth=1.8;
const hitboxDepth=1.8;

async function loadNoob(){

 const loader=new OBJLoader();

 try{

  player=await loader.loadAsync("noob.obj");

  const textureLoader=new THREE.TextureLoader();

  const texture=await textureLoader.loadAsync(
   "texture_noob.png"
  );

  texture.colorSpace=THREE.SRGBColorSpace;

  const material=new THREE.MeshStandardMaterial({
   map:texture,
   roughness:.8
  });

  player.traverse(object=>{

   if(object.isMesh){

    object.material=material;
    object.castShadow=true;
    object.receiveShadow=true;

    const name=object.name.toLowerCase();

    if(name.includes("leftarm")||name.includes("left_arm"))leftArm=object;
    if(name.includes("rightarm")||name.includes("right_arm"))rightArm=object;
    if(name.includes("leftleg")||name.includes("left_leg"))leftLeg=object;
    if(name.includes("rightleg")||name.includes("right_leg"))rightLeg=object;

   }

  });

  // Normalize the model to approximately 3 world units tall.
  player.scale.setScalar(1);

  let bounds=new THREE.Box3().setFromObject(player);
  let size=new THREE.Vector3();
  bounds.getSize(size);

  if(size.y>0){

   player.scale.setScalar(playerHeight/size.y);

  }

  bounds.setFromObject(player);

  player.position.set(0,-bounds.min.y,3);

  scene.add(player);

 }catch(error){

  console.error("Noob model loading failed:",error);

 }

}


/* INPUT */

const keys={};

window.addEventListener("keydown",event=>{

 const key=event.key.toLowerCase();

 if(["w","a","s","d"," "].includes(key)){

  keys[key]=true;

  if(key===" ")event.preventDefault();

 }

});

window.addEventListener("keyup",event=>{
 keys[event.key.toLowerCase()]=false;
});

window.addEventListener("blur",()=>{
 Object.keys(keys).forEach(key=>keys[key]=false);
 jumpPressed=false;
});


/* MOBILE JOYSTICK */

let joyX=0;
let joyY=0;
let jumpPressed=false;

const stick=document.getElementById("stick");
const nub=document.getElementById("nub");

stick.addEventListener("pointerdown",event=>{

 stick.setPointerCapture(event.pointerId);
 moveStick(event);

});

stick.addEventListener("pointermove",event=>{

 if(stick.hasPointerCapture(event.pointerId)){
  moveStick(event);
 }

});

function moveStick(event){

 const rect=stick.getBoundingClientRect();

 const dx=event.clientX-(rect.left+rect.width/2);
 const dy=event.clientY-(rect.top+rect.height/2);

 const length=Math.hypot(dx,dy);
 const max=34;
 const factor=length>max?max/length:1;

 const x=dx*factor;
 const y=dy*factor;

 joyX=x/max;
 joyY=y/max;

 nub.style.transform=`translate(${x}px,${y}px)`;

}

function resetStick(){

 joyX=0;
 joyY=0;
 nub.style.transform="translate(0,0)";

}

stick.addEventListener("pointerup",resetStick);
stick.addEventListener("pointercancel",resetStick);

const jumpButton=document.getElementById("jump");

jumpButton.addEventListener("pointerdown",event=>{
 event.preventDefault();
 jumpPressed=true;
});

jumpButton.addEventListener("pointerup",()=>{
 jumpPressed=false;
});

jumpButton.addEventListener("pointercancel",()=>{
 jumpPressed=false;
});


/* CAMERA ROTATION */

let cameraYaw=0;
let cameraPitch=.28;

let cameraDragging=false;
let previousPointerX=0;
let previousPointerY=0;

canvas.addEventListener("pointerdown",event=>{

 if(event.target.closest("#mobileControls"))return;

 cameraDragging=true;

 previousPointerX=event.clientX;
 previousPointerY=event.clientY;

 canvas.setPointerCapture(event.pointerId);

});

canvas.addEventListener("pointermove",event=>{

 if(!cameraDragging)return;

 const dx=event.clientX-previousPointerX;
 const dy=event.clientY-previousPointerY;

 previousPointerX=event.clientX;
 previousPointerY=event.clientY;

 cameraYaw-=dx*.006;
 cameraPitch-=dy*.006;

 cameraPitch=THREE.MathUtils.clamp(
  cameraPitch,-.15,1.1
 );

});

function stopCameraDrag(){
 cameraDragging=false;
}

canvas.addEventListener("pointerup",stopCameraDrag);
canvas.addEventListener("pointercancel",stopCameraDrag);


/* HITBOX + COLLISION */

function makePlayerBox(x,y,z){

 return new THREE.Box3(
  new THREE.Vector3(
   x-hitboxWidth/5,
   y,
   z-hitboxDepth/5
  ),
  new THREE.Vector3(
   x+hitboxWidth/2,
   y+playerHeight/3,
   z+hitboxDepth/2
  )
 );

}

function collidesAt(x,y,z){

 const playerBox=makePlayerBox(x,y,z);

 for(const collider of collisionObjects){

  if(playerBox.intersectsBox(collider.bounds)){
   return true;
  }

 }

 return false;

}


/* MOVEMENT */

let verticalVelocity=0;
let jumpLock=false;
let walkTime=0;

function updatePlayer(dt){

 if(!player)return;

 const forward=(keys.w?1:0)-(keys.s?1:0)-joyY;
 const side=(keys.d?1:0)-(keys.a?1:0)+joyX;

 // Movement relative to camera direction.
 let moveX=side*Math.cos(cameraYaw)-forward*Math.sin(cameraYaw);
 let moveZ=-side*Math.sin(cameraYaw)-forward*Math.cos(cameraYaw);

 const direction=new THREE.Vector2(moveX,moveZ);

 if(direction.length()>1)direction.normalize();

 const speed=6;

 const nextX=player.position.x+direction.x*speed*dt;
 const nextZ=player.position.z+direction.y*speed*dt;

 // Separate X and Z checks allow sliding along walls.
 if(!collidesAt(nextX,player.position.y,player.position.z)){
  player.position.x=nextX;
 }

 if(!collidesAt(player.position.x,player.position.y,nextZ)){
  player.position.z=nextZ;
 }

 const moving=direction.length()>.05;

 if(moving){

  walkTime+=dt*9;

  if(leftArm)leftArm.rotation.x=Math.sin(walkTime)*.55;
  if(rightArm)rightArm.rotation.x=-Math.sin(walkTime)*.55;
  if(leftLeg)leftLeg.rotation.x=-Math.sin(walkTime)*.45;
  if(rightLeg)rightLeg.rotation.x=Math.sin(walkTime)*.45;

 }else{

  [leftArm,rightArm,leftLeg,rightLeg].forEach(part=>{

   if(part){
    part.rotation.x=THREE.MathUtils.damp(
     part.rotation.x,0,8,dt
    );
   }

  });

 }

 // Jumping.
 if(player.position.y<=0.001){

  player.position.y=0;

  if((keys[" "]||jumpPressed)&&!jumpLock){

   verticalVelocity=8;
   jumpLock=true;

  }

 }

 if(!keys[" "]&&!jumpPressed)jumpLock=false;

 verticalVelocity-=20*dt;

 player.position.y+=verticalVelocity*dt;

 if(player.position.y<=0){

  player.position.y=0;
  verticalVelocity=0;

 }

 // Camera follows the player and rotates around them.
 const target=player.position.clone().add(
  new THREE.Vector3(0,1.7,0)
 );

 const distance=9;
 const horizontal=distance*Math.cos(cameraPitch);

 const cameraTarget=new THREE.Vector3(
  player.position.x+Math.sin(cameraYaw)*horizontal,
  player.position.y+2+Math.sin(cameraPitch)*distance,
  player.position.z+Math.cos(cameraYaw)*horizontal
 );

 camera.position.lerp(
  cameraTarget,
  Math.min(1,dt*8)
 );

 camera.lookAt(target);

}


/* RESIZE */

function resize(){

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);

}

window.addEventListener("resize",resize);
resize();


/* START */

await loadGame();
await loadNoob();


/* LOOP */

const clock=new THREE.Clock();

function animate(){

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.05);

 updatePlayer(dt);

 renderer.render(scene,camera);

}

animate();

</script>
</body>
</html>
