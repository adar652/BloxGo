
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BloxGo Studio</title>
<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}}
</script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf4fc;color:#193451;font-family:Arial,sans-serif;overflow:hidden}
button,input{font:inherit}
button{border:1px solid #c6d9ee;background:#fff;color:#23476d;border-radius:8px;padding:9px 12px;cursor:pointer}
button:hover{background:#e2f0ff}
button.active{background:#d7ebff;border-color:#459ce8;color:#1264a9}
#app{height:100dvh;display:flex;flex-direction:column}
#topbar{height:54px;flex-shrink:0;background:#fff;border-bottom:1px solid #cbdced;display:flex;align-items:center;gap:6px;padding:0 10px;overflow-x:auto}
#brand{font-weight:800;font-size:17px;color:#1477c9;white-space:nowrap;margin-right:10px}
#main{flex:1;min-height:0;display:flex}
aside{width:190px;flex-shrink:0;background:#fff;overflow:auto}
#left{border-right:1px solid #cbdced}
#right{border-left:1px solid #cbdced}
.panel-title{font-weight:bold;padding:12px;border-bottom:1px solid #d8e5f2;color:#2878b9}
.panel-content{padding:9px;display:flex;flex-direction:column;gap:7px}
.section{font-size:11px;color:#7392b2;text-transform:uppercase;margin:8px 0 2px}
#viewport{flex:1;min-width:0;position:relative;background:#dceafa;overflow:hidden}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none}
#viewport-label{position:absolute;top:10px;left:12px;color:#47759f;font-size:12px;pointer-events:none}
.item{padding:8px;border-radius:7px;background:#f0f6fc;border:1px solid transparent;cursor:pointer;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.selected{background:#d8edff;border-color:#65a9e8}
#bottom{height:76px;flex-shrink:0;background:#fff;border-top:1px solid #cbdced;overflow:auto}
#output{padding:9px;color:#55728f;font-size:12px;white-space:pre-wrap}
.prop{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#53718f}
.prop input{width:100%;background:#f7fbff;color:#193451;border:1px solid #c6d9ee;border-radius:5px;padding:7px;min-width:0}
.xyz{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.xyz input{width:100%;min-width:0}
.small{font-size:11px;color:#7b95ae}
#fileInput{display:none}
#mobileControls{display:none;position:absolute;bottom:20px;left:15px;right:15px;justify-content:space-between;align-items:end;pointer-events:none}
#joystick{width:116px;height:116px;border-radius:50%;background:#ffffff88;border:2px solid #6b9fc9;position:relative;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:44px;height:44px;border-radius:50%;background:#287fca;left:34px;top:34px;box-shadow:0 2px 8px #3458}
#jump{width:76px;height:76px;border-radius:50%;background:#2585d4;color:white;border:2px solid white;font-weight:bold;pointer-events:auto;touch-action:none}
#publishName{width:145px;min-width:100px;padding:8px;border:1px solid #c6d9ee;border-radius:8px}
#playBadge{position:absolute;top:10px;right:10px;background:#2585d4;color:white;border-radius:8px;padding:7px 10px;font-size:12px;display:none}
@media(max-width:700px){
 aside{width:125px}
 #right{width:145px}
 .panel-content{padding:6px}
 button{padding:8px;font-size:12px}
 #brand{font-size:14px}
 #topbar{gap:4px}
 #publishName{width:110px}
}
@media(max-width:430px){
 aside{width:92px}
 #right{width:118px}
 .item{font-size:10px;padding:6px 3px}
}
@media(pointer:coarse){
 #mobileControls.visible{display:flex}
}
</style>
</head>
<body>
<div id="app">
<header id="topbar">
<div id="brand">BloxGo Studio</div>
<button id="addPart">Part</button>
<button id="addSphere">Sphere</button>
<button id="addCylinder">Cylinder</button>
<button id="importObj">Import OBJ</button>
<button id="move" class="active">Move</button>
<button id="rotate">Rotate</button>
<button id="scale">Scale</button>
<button id="play">Play Test</button>
<button id="stop">Stop</button>
<input id="publishName" placeholder="Game name" value="My Game">
<button id="publish">Publish</button>
<input id="fileInput" type="file" accept=".obj">
</header>

<div id="main">
<aside id="left">
<div class="panel-title">Toolbox</div>
<div class="panel-content">
<div class="section">Create</div>
<button id="toolPart">Part</button>
<button id="toolSphere">Sphere</button>
<button id="toolCylinder">Cylinder</button>
<div class="section">Import</div>
<button id="toolObj">OBJ Model</button>
<p class="small">Add 3D objects to your world.</p>
</div>
</aside>

<section id="viewport">
<div id="viewport-label">3D Workspace</div>
<div id="playBadge">PLAY TEST</div>
<div id="mobileControls">
<div id="joystick"><div id="stick"></div></div>
<button id="jump">JUMP</button>
</div>
</section>

<aside id="right">
<div class="panel-title">Explorer</div>
<div class="panel-content" id="explorer"></div>
<div class="panel-title">Properties</div>
<div class="panel-content" id="properties">
<p class="small">Select an object.</p>
</div>
</aside>
</div>

<footer id="bottom">
<div class="panel-title">Output</div>
<div id="output">BloxGo Studio ready.</div>
</footer>
</div>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {TransformControls} from "three/addons/controls/TransformControls.js";
import {OBJLoader} from "three/addons/loaders/OBJLoader.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import {getAuth} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
import {getFirestore,doc,setDoc,serverTimestamp}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyBui_UWCNABfF3wBYBMzi6Q5dLGvykfhaM",
 authDomain:"bloxgo-data.firebaseapp.com",
 projectId:"bloxgo-data",
 storageBucket:"bloxgo-data.firebasestorage.app",
 messagingSenderId:"905482130911",
 appId:"1:905482130911:web:273e391163a595ca32606a",
 measurementId:"G-4WYW9MNZ6Z"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
const viewport=$("viewport");
const output=$("output");
const objects=[];
let selected=null,playing=false,player=null;
let velocityY=0,onGround=true;
const keys={w:false,a:false,s:false,d:false};
let joy={x:0,y:0,active:false};

function log(t){output.textContent=t+"\n"+output.textContent}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xdceafa);

const camera=new THREE.PerspectiveCamera(60,1,.1,1000);
camera.position.set(10,9,12);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
viewport.appendChild(renderer.domElement);

const orbit=new OrbitControls(camera,renderer.domElement);
orbit.enableDamping=true;
orbit.target.set(0,1,0);

scene.add(new THREE.HemisphereLight(0xffffff,0x91a9c4,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(8,15,10);
sun.castShadow=true;
scene.add(sun);

const grid=new THREE.GridHelper(100,100,0x8bb8df,0xb7cee5);
scene.add(grid);

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),
 new THREE.MeshStandardMaterial({color:0xeaf2fa,roughness:1})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.05;
floor.receiveShadow=true;
scene.add(floor);

const transform=new TransformControls(camera,renderer.domElement);
scene.add(transform.getHelper());
transform.addEventListener("dragging-changed",e=>orbit.enabled=!e.value);

function resize(){
 const w=viewport.clientWidth,h=viewport.clientHeight;
 if(!w||!h)return;
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
 renderer.setSize(w,h,false);
}
new ResizeObserver(resize).observe(viewport);
resize();

function addObject(type){
 let geometry;
 if(type==="Part")geometry=new THREE.BoxGeometry(2,2,2);
 if(type==="Sphere")geometry=new THREE.SphereGeometry(1,32,24);
 if(type==="Cylinder")geometry=new THREE.CylinderGeometry(1,1,2,32);
 const mesh=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({
  color:0x55a7e8,roughness:.65
 }));
 mesh.name=type+" "+(objects.length+1);
 mesh.position.set(0,1,0);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);
 objects.push(mesh);
 selectObject(mesh);
 log(type+" created.");
}

function importOBJ(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const obj=new OBJLoader().parse(reader.result);
   obj.name=file.name.replace(/\.obj$/i,"");
   obj.traverse(c=>{
    if(c.isMesh){
     c.material=new THREE.MeshStandardMaterial({color:0xa9c7df});
     c.castShadow=true;
     c.receiveShadow=true;
    }
   });
   obj.position.set(0,0,0);
   scene.add(obj);
   objects.push(obj);
   selectObject(obj);
   log("Imported "+file.name);
  }catch(e){log("OBJ error: "+e.message)}
 };
 reader.readAsText(file);
}

function selectObject(o){
 selected=o;
 transform.detach();
 if(o&&!playing)transform.attach(o);
 refreshExplorer();
 updateProperties();
}

function refreshExplorer(){
 const box=$("explorer");
 box.innerHTML="";
 const world=document.createElement("div");
 world.className="item";
 world.textContent="World";
 box.appendChild(world);
 objects.forEach(o=>{
  const el=document.createElement("div");
  el.className="item"+(o===selected?" selected":"");
  el.textContent="▰ "+o.name;
  el.onclick=()=>selectObject(o);
  box.appendChild(el);
 });
}

function updateProperties(){
 const panel=$("properties");
 panel.innerHTML="";
 if(!selected){
  panel.innerHTML='<p class="small">Select an object.</p>';
  return;
 }
 const name=document.createElement("input");
 name.value=selected.name;
 name.onchange=()=>{selected.name=name.value;refreshExplorer()};
 const label=document.createElement("label");
 label.className="prop";
 label.textContent="Name";
 label.appendChild(name);
 panel.appendChild(label);

 function vector(title,v,fn,rotation=false){
  const heading=document.createElement("div");
  heading.className="section";
  heading.textContent=title;
  panel.appendChild(heading);
  const row=document.createElement("div");
  row.className="xyz";
  ["X","Y","Z"].forEach((axis,i)=>{
   const input=document.createElement("input");
   input.type="number";input.step=".1";
   input.value=(rotation?THREE.MathUtils.radToDeg(v.getComponent(i)):v.getComponent(i)).toFixed(1);
   input.title=axis;
   input.onchange=()=>{
    const n=Number(input.value);
    if(!Number.isFinite(n))return;
    v.setComponent(i,rotation?THREE.MathUtils.degToRad(n):n);
   };
   row.appendChild(input);
  });
  panel.appendChild(row);
 }
 vector("Position",selected.position,()=>{});
 vector("Rotation",selected.rotation,()=>{},true);
 vector("Scale",selected.scale,()=>{});

 const del=document.createElement("button");
 del.textContent="Delete";
 del.onclick=deleteSelected;
 panel.appendChild(del);
 const dup=document.createElement("button");
 dup.textContent="Duplicate";
 dup.onclick=duplicateSelected;
 panel.appendChild(dup);
}

function deleteSelected(){
 if(!selected)return;
 scene.remove(selected);
 const i=objects.indexOf(selected);
 if(i>=0)objects.splice(i,1);
 transform.detach();selected=null;
 refreshExplorer();updateProperties();log("Object deleted.");
}
function duplicateSelected(){
 if(!selected)return;
 const copy=selected.clone(true);
 copy.name=selected.name+" Copy";
 copy.position.x+=2;
 scene.add(copy);objects.push(copy);
 selectObject(copy);
}
function setMode(m){
 transform.setMode(m);
 ["move","rotate","scale"].forEach(id=>{
  $(id).classList.toggle("active",
   id===(m==="translate"?"move":m));
 });
}

$("addPart").onclick=$("toolPart").onclick=()=>addObject("Part");
$("addSphere").onclick=$("toolSphere").onclick=()=>addObject("Sphere");
$("addCylinder").onclick=$("toolCylinder").onclick=()=>addObject("Cylinder");
$("importObj").onclick=$("toolObj").onclick=()=>$("fileInput").click();
$("fileInput").onchange=e=>{importOBJ(e.target.files[0]);e.target.value=""};
$("move").onclick=()=>setMode("translate");
$("rotate").onclick=()=>setMode("rotate");
$("scale").onclick=()=>setMode("scale");

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
renderer.domElement.addEventListener("pointerdown",e=>{
 if(playing||transform.dragging)return;
 const r=renderer.domElement.getBoundingClientRect();
 pointer.x=((e.clientX-r.left)/r.width)*2-1;
 pointer.y=-((e.clientY-r.top)/r.height)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(objects,true);
 if(hits.length){
  let o=hits[0].object;
  while(o.parent&&o.parent!==scene)o=o.parent;
  if(objects.includes(o))selectObject(o);
 }else selectObject(null);
});

function makePlayer(){
 const group=new THREE.Group();
 const mat=(color)=>new THREE.MeshStandardMaterial({color});
 const body=new THREE.Mesh(new THREE.BoxGeometry(.9,1.1,.45),mat(0x1686d9));
 body.position.y=1.35;
 const head=new THREE.Mesh(new THREE.BoxGeometry(.72,.72,.72),mat(0xffd19a));
 head.position.y=2.25;
 const legMat=mat(0x263c60);
 const leftLeg=new THREE.Mesh(new THREE.BoxGeometry(.34,.85,.38),legMat);
 const rightLeg=leftLeg.clone();
 leftLeg.position.set(-.24,.43,0);
 rightLeg.position.set(.24,.43,0);
 const armMat=mat(0xffd19a);
 const leftArm=new THREE.Mesh(new THREE.BoxGeometry(.3,.9,.35),armMat);
 const rightArm=leftArm.clone();
 leftArm.position.set(-.62,1.4,0);
 rightArm.position.set(.62,1.4,0);
 [body,head,leftLeg,rightLeg,leftArm,rightArm].forEach(m=>{
  m.castShadow=true;group.add(m);
 });
 group.name="Player";
 group.position.set(0,0,4);
 scene.add(group);
 return group;
}

function startPlay(){
 if(playing)return;
 playing=true;
 transform.detach();
 orbit.enabled=false;
 player=makePlayer();
 velocityY=0;
 $("playBadge").style.display="block";
 $("mobileControls").classList.add("visible");
 log("Play Test started. Desktop: WASD + Space. Mobile: joystick + jump.");
}
function stopPlay(){
 if(!playing)return;
 playing=false;
 if(player)scene.remove(player);
 player=null;
 orbit.enabled=true;
 if(selected)transform.attach(selected);
 $("playBadge").style.display="none";
 $("mobileControls").classList.remove("visible");
 Object.keys(keys).forEach(k=>keys[k]=false);
 joy.x=joy.y=0;
 $("stick").style.transform="translate(0,0)";
 log("Play Test stopped.");
}
$("play").onclick=startPlay;
$("stop").onclick=stopPlay;

window.addEventListener("keydown",e=>{
 if(["INPUT"].includes(document.activeElement.tagName))return;
 const k=e.key.toLowerCase();
 if(k==="w"||k==="a"||k==="s"||k==="d"){
  keys[k]=true;e.preventDefault();
 }
 if(e.code==="Space"&&playing){jump();e.preventDefault()}
});
window.addEventListener("keyup",e=>{
 const k=e.key.toLowerCase();
 if(k in keys)keys[k]=false;
});

function jump(){
 if(playing&&onGround){velocityY=8;onGround=false}
}

const joyBase=$("joystick"),stick=$("stick");
joyBase.addEventListener("pointerdown",e=>{
 joy.active=true;joyBase.setPointerCapture(e.pointerId);moveJoy(e);
});
joyBase.addEventListener("pointermove",e=>{if(joy.active)moveJoy(e)});
function moveJoy(e){
 const r=joyBase.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 const max=38,len=Math.hypot(x,y);
 if(len>max){x=x/len*max;y=y/len*max}
 joy.x=x/max;joy.y=y/max;
 stick.style.transform=`translate(${x}px,${y}px)`;
}
function releaseJoy(){
 joy.active=false;joy.x=joy.y=0;
 stick.style.transform="translate(0,0)";
}
joyBase.addEventListener("pointerup",releaseJoy);
joyBase.addEventListener("pointercancel",releaseJoy);
$("jump").addEventListener("pointerdown",e=>{e.preventDefault();jump()});

let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;

 if(playing&&player){
  const x=(keys.d?1:0)-(keys.a?1:0)+joy.x;
  const z=(keys.s?1:0)-(keys.w?1:0)+joy.y;
  const direction=new THREE.Vector3(x,0,z);
  if(direction.length()>1)direction.normalize();
  player.position.x+=direction.x*6*dt;
  player.position.z+=direction.z*6*dt;
  if(direction.lengthSq()>.01)player.rotation.y=Math.atan2(direction.x,direction.z);
  velocityY-=20*dt;
  player.position.y+=velocityY*dt;
  if(player.position.y<=0){player.position.y=0;velocityY=0;onGround=true}
  const target=new THREE.Vector3(player.position.x+7,player.position.y+6,player.position.z+9);
  camera.position.lerp(target,.09);
  camera.lookAt(player.position.x,player.position.y+1,player.position.z);
 }else{
  orbit.update();
 }
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

function makeGameId(){
 return "bg-"+crypto.randomUUID().replaceAll("-","").slice(0,18);
}

$("publish").onclick=async()=>{
 if(playing){log("Stop Play Test before publishing.");return}
 const user=auth.currentUser;
 if(!user){log("Log in to your BloxGo account before publishing.");return}
 const title=$("publishName").value.trim();
 if(!title){log("Enter a game name first.");return}

 const button=$("publish");
 button.disabled=true;
 button.textContent="Publishing...";
 try{
  const id=makeGameId();
  const project=scene.toJSON();
  await setDoc(doc(db,"publishedGames",id),{
   title,
   ownerUid:user.uid,
   scene:project,
   createdAt:serverTimestamp(),
   updatedAt:serverTimestamp(),
   version:1
  });
  const url=new URL("play.html",location.href);
  url.searchParams.set("id",id);
  await navigator.clipboard?.writeText(url.href).catch(()=>{});
  log("Published successfully: "+url.href);
  alert("Game published!\n\n"+url.href+"\n\nThe link was copied if clipboard access was available.");
 }catch(e){
  log("Publish failed: "+e.message);
  alert("Publish failed: "+e.message);
 }finally{
  button.disabled=false;
  button.textContent="Publish";
 }
};

window.addEventListener("keydown",e=>{
 if(e.key==="Delete"&&!playing&&document.activeElement.tagName!=="INPUT")deleteSelected();
});

addObject("Part");
log("BloxGo Studio 0.1 loaded.");
</script>
</body>
</html>
