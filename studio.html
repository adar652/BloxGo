
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BloxGo Studio</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080f1d;color:#eaf3ff;font-family:Arial,sans-serif;overflow:hidden}
button,input{font:inherit}
button{background:#172b46;color:#eaf3ff;border:1px solid #29476d;border-radius:7px;padding:9px 12px;cursor:pointer}
button:hover{background:#245080}
button.active{background:#176fc2;border-color:#48aaff}
#app{height:100dvh;display:flex;flex-direction:column}
#topbar{height:52px;flex-shrink:0;background:#101e33;border-bottom:1px solid #29415e;display:flex;align-items:center;gap:7px;padding:0 10px;overflow-x:auto}
#brand{font-size:17px;font-weight:bold;color:#60b4ff;margin-right:12px;white-space:nowrap}
#main{flex:1;min-height:0;display:flex}
#left,#right{width:210px;flex-shrink:0;background:#101d30;border-color:#263e5c;display:flex;flex-direction:column;overflow:auto}
#left{border-right:1px solid #263e5c}
#right{border-left:1px solid #263e5c}
.panel-title{padding:12px;font-weight:bold;border-bottom:1px solid #263e5c;color:#8fcaff}
.panel-content{padding:10px;display:flex;flex-direction:column;gap:8px}
#viewport{flex:1;min-width:0;position:relative;background:#101b2b;overflow:hidden}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none}
#viewport-label{position:absolute;top:10px;left:12px;color:#8ca9ca;font-size:12px;pointer-events:none}
#bottom{height:105px;flex-shrink:0;background:#0c1728;border-top:1px solid #263e5c;overflow:auto}
#output{padding:10px;color:#9db7d7;font-size:12px;white-space:pre-wrap}
.section{font-size:11px;color:#7fa8d5;text-transform:uppercase;margin:8px 0 3px}
.item{padding:8px;border-radius:6px;background:#172b45;border:1px solid transparent;cursor:pointer;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.selected{background:#174d7b;border-color:#58aaff}
.prop{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#a9c4e4}
.prop input{width:100%;background:#091526;color:white;border:1px solid #29476d;border-radius:5px;padding:7px;min-width:0}
.xyz{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.small{font-size:11px;color:#819bb9}
#fileInput{display:none}
@media(max-width:700px){
 #left{width:105px}
 #right{width:145px}
 .panel-content{padding:6px}
 button{padding:8px;font-size:12px}
 #brand{font-size:14px}
 #topbar{gap:4px}
 .item{font-size:11px;padding:7px 4px}
}
@media(max-width:420px){
 #left{width:85px}
 #right{width:125px}
}
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
 }
}
</script>
</head>

<body>
<div id="app">

<header id="topbar">
 <div id="brand">BloxGo Studio</div>
 <button id="addPart">Part</button>
 <button id="addSphere">Sphere</button>
 <button id="addCylinder">Cylinder</button>
 <button id="importObj">Import OBJ</button>
 <button id="move" class="active">Move</button>
 <button id="rotate">Rotate</button>
 <button id="scale">Scale</button>
 <button id="play">Play</button>
 <button id="stop">Stop</button>
 <button id="save">Save</button>
 <input id="fileInput" type="file" accept=".obj">
</header>

<div id="main">

<aside id="left">
 <div class="panel-title">Toolbox</div>
 <div class="panel-content">
  <div class="section">Create</div>
  <button id="toolPart">Part</button>
  <button id="toolSphere">Sphere</button>
  <button id="toolCylinder">Cylinder</button>
  <div class="section">Import</div>
  <button id="toolObj">OBJ Model</button>
  <p class="small">Import 3D models from your device.</p>
 </div>
</aside>

<section id="viewport">
 <div id="viewport-label">3D Workspace</div>
</section>

<aside id="right">
 <div class="panel-title">Explorer</div>
 <div class="panel-content" id="explorer"></div>
 <div class="panel-title">Properties</div>
 <div class="panel-content" id="properties">
  <p class="small">Select an object to edit its properties.</p>
 </div>
</aside>

</div>

<footer id="bottom">
 <div class="panel-title">Output</div>
 <div id="output">BloxGo Studio 0.1 ready.</div>
</footer>
</div>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {TransformControls} from "three/addons/controls/TransformControls.js";
import {OBJLoader} from "three/addons/loaders/OBJLoader.js";

const $=id=>document.getElementById(id);
const viewport=$("viewport");
const output=$("output");
const objects=[];
let selected=null;
let playing=false;

function log(message){
 output.textContent=message+"\n"+output.textContent;
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101b2b);

const camera=new THREE.PerspectiveCamera(
 60,1,0.1,1000
);
camera.position.set(9,8,12);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 alpha:false
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
viewport.appendChild(renderer.domElement);

const orbit=new OrbitControls(camera,renderer.domElement);
orbit.enableDamping=true;
orbit.target.set(0,1,0);

scene.add(new THREE.HemisphereLight(0xb9dcff,0x26344b,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(8,15,10);
sun.castShadow=true;
scene.add(sun);

const grid=new THREE.GridHelper(100,100,0x3975a8,0x243a56);
scene.add(grid);

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),
 new THREE.MeshStandardMaterial({
  color:0x17283d,
  roughness:1
 })
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-0.03;
floor.receiveShadow=true;
scene.add(floor);

const transform=new TransformControls(camera,renderer.domElement);
scene.add(transform.getHelper());

transform.addEventListener("dragging-changed",event=>{
 orbit.enabled=!event.value;
});

transform.addEventListener("objectChange",()=>{
 updateProperties();
});

function resize(){
 const w=viewport.clientWidth;
 const h=viewport.clientHeight;
 if(!w||!h)return;
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
 renderer.setSize(w,h,false);
}
new ResizeObserver(resize).observe(viewport);
resize();

function addObject(type){
 let geometry;
 if(type==="Part")geometry=new THREE.BoxGeometry(2,2,2);
 if(type==="Sphere")geometry=new THREE.SphereGeometry(1,32,24);
 if(type==="Cylinder")geometry=new THREE.CylinderGeometry(1,1,2,32);

 const material=new THREE.MeshStandardMaterial({
  color:0x398bd5,
  roughness:0.65
 });

 const mesh=new THREE.Mesh(geometry,material);
 mesh.name=type+" "+(objects.length+1);
 mesh.position.set(0,1,0);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);
 objects.push(mesh);
 selectObject(mesh);
 refreshExplorer();
 log(type+" created.");
}

function importOBJ(file){
 if(!file)return;
 const reader=new FileReader();

 reader.onload=()=>{
  try{
   const loader=new OBJLoader();
   const object=loader.parse(reader.result);
   object.name=file.name.replace(/\.obj$/i,"");
   object.traverse(child=>{
    if(child.isMesh){
     child.material=new THREE.MeshStandardMaterial({
      color:0xb4c9df,
      roughness:0.8
     });
     child.castShadow=true;
     child.receiveShadow=true;
    }
   });
   object.position.set(0,0,0);
   scene.add(object);
   objects.push(object);
   selectObject(object);
   refreshExplorer();
   log("Imported OBJ: "+file.name);
  }catch(error){
   log("OBJ import failed: "+error.message);
  }
 };
 reader.readAsText(file);
}

function selectObject(object){
 selected=object;
 transform.detach();

 if(selected&&!playing){
  transform.attach(selected);
 }
 refreshExplorer();
 updateProperties();
}

function refreshExplorer(){
 const list=$("explorer");
 list.innerHTML="";

 const world=document.createElement("div");
 world.className="item";
 world.textContent="World";
 list.appendChild(world);

 objects.forEach(object=>{
  const item=document.createElement("div");
  item.className="item"+(object===selected?" selected":"");
  item.textContent="▰ "+object.name;
  item.onclick=()=>selectObject(object);
  list.appendChild(item);
 });
}

function field(label,axis,value,onChange){
 const wrapper=document.createElement("label");
 wrapper.className="prop";
 wrapper.textContent=label;

 const input=document.createElement("input");
 input.type="number";
 input.step="0.1";
 input.value=Number(value).toFixed(2);
 input.onchange=()=>{
  const n=Number(input.value);
  if(Number.isFinite(n))onChange(n);
 };

 wrapper.appendChild(input);
 return wrapper;
}

function updateProperties(){
 const panel=$("properties");
 panel.innerHTML="";

 if(!selected){
  panel.innerHTML='<p class="small">Select an object to edit its properties.</p>';
  return;
 }

 const nameLabel=document.createElement("label");
 nameLabel.className="prop";
 nameLabel.textContent="Name";
 const nameInput=document.createElement("input");
 nameInput.value=selected.name;
 nameInput.onchange=()=>{
  selected.name=nameInput.value;
  refreshExplorer();
 };
 nameLabel.appendChild(nameInput);
 panel.appendChild(nameLabel);

 function vectorSection(title,vector,callback){
  const heading=document.createElement("div");
  heading.className="section";
  heading.textContent=title;
  panel.appendChild(heading);

  const row=document.createElement("div");
  row.className="xyz";
  ["X","Y","Z"].forEach((axis,index)=>{
   const input=document.createElement("input");
   input.type="number";
   input.step="0.1";
   input.value=vector.getComponent(index).toFixed(2);
   input.title=axis;
   input.onchange=()=>{
    const value=Number(input.value);
    if(Number.isFinite(value)){
     vector.setComponent(index,value);
     callback();
    }
   };
   row.appendChild(input);
  });
  panel.appendChild(row);
 }

 vectorSection("Position",selected.position,()=>{
  selected.updateMatrixWorld();
 });

 vectorSection("Rotation",selected.rotation,()=>{
  selected.rotation.set(
   THREE.MathUtils.degToRad(selected.rotation.x*180/Math.PI),
   THREE.MathUtils.degToRad(selected.rotation.y*180/Math.PI),
   THREE.MathUtils.degToRad(selected.rotation.z*180/Math.PI)
  );
 });

 vectorSection("Scale",selected.scale,()=>{});

 const remove=document.createElement("button");
 remove.textContent="Delete Object";
 remove.onclick=deleteSelected;
 panel.appendChild(remove);

 const duplicate=document.createElement("button");
 duplicate.textContent="Duplicate Object";
 duplicate.onclick=duplicateSelected;
 panel.appendChild(duplicate);
}

function deleteSelected(){
 if(!selected)return;
 transform.detach();
 scene.remove(selected);
 const index=objects.indexOf(selected);
 if(index>=0)objects.splice(index,1);
 selected=null;
 refreshExplorer();
 updateProperties();
 log("Object deleted.");
}

function duplicateSelected(){
 if(!selected)return;
 const copy=selected.clone(true);
 copy.name=selected.name+" Copy";
 copy.position.x+=2;
 scene.add(copy);
 objects.push(copy);
 selectObject(copy);
 log("Object duplicated.");
}

function setMode(mode){
 transform.setMode(mode);
 ["move","rotate","scale"].forEach(id=>{
  $(id).classList.toggle("active",id===mode);
 });
}

$("addPart").onclick=$("toolPart").onclick=()=>addObject("Part");
$("addSphere").onclick=$("toolSphere").onclick=()=>addObject("Sphere");
$("addCylinder").onclick=$("toolCylinder").onclick=()=>addObject("Cylinder");

$("importObj").onclick=$("toolObj").onclick=()=>$("fileInput").click();
$("fileInput").onchange=event=>{
 importOBJ(event.target.files[0]);
 event.target.value="";
};

$("move").onclick=()=>setMode("translate");
$("rotate").onclick=()=>setMode("rotate");
$("scale").onclick=()=>setMode("scale");

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

renderer.domElement.addEventListener("pointerdown",event=>{
 if(transform.dragging)return;

 const rect=renderer.domElement.getBoundingClientRect();
 pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
 pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;

 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(objects,true);

 if(hits.length){
  let object=hits[0].object;
  while(object.parent&&object.parent!==scene){
   object=object.parent;
  }
  if(objects.includes(object)){
   selectObject(object);
  }
 }else{
  selectObject(null);
 }
});

$("play").onclick=()=>{
 if(playing)return;
 playing=true;
 transform.detach();
 orbit.enabled=true;
 log("Play mode started.");
};

$("stop").onclick=()=>{
 if(!playing)return;
 playing=false;
 if(selected)transform.attach(selected);
 log("Play mode stopped.");
};

$("save").onclick=()=>{
 const data=scene.toJSON();
 const blob=new Blob(
  [JSON.stringify(data,null,2)],
  {type:"application/json"}
 );
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="BloxGo-Project.json";
 a.click();
 URL.revokeObjectURL(url);
 log("Project JSON exported.");
};

window.addEventListener("keydown",event=>{
 if(event.target instanceof HTMLInputElement)return;
 if(event.key==="Delete"||event.key==="Backspace")deleteSelected();
 if(event.key==="w")setMode("translate");
 if(event.key==="e")setMode("rotate");
 if(event.key==="r")setMode("scale");
});

function animate(){
 requestAnimationFrame(animate);
 orbit.update();
 renderer.render(scene,camera);
}
animate();

addObject("Part");
log("Workspace initialized.");
</script>
</body>
  </html>
