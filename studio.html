<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BloxGo Studio</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#edf5ff;
 color:#173b65;
}
header{
 height:58px;
 background:white;
 border-bottom:1px solid #d5e5f8;
 display:flex;
 align-items:center;
 padding:10px;
 gap:10px;
}
.logo{font-size:19px;font-weight:bold;color:#1976e8;margin-right:auto}
button{
 border:1px solid #cbdcf0;
 background:white;
 color:#174477;
 padding:10px 13px;
 border-radius:9px;
 cursor:pointer;
 font-weight:bold;
}
.primary{background:#2378e8;color:white;border:0}
main{
 height:calc(100vh - 58px);
 display:grid;
 grid-template-columns:180px 1fr 220px;
}
.panel{
 background:white;
 padding:12px;
 overflow:auto;
 border-right:1px solid #d5e5f8;
}
.right{border-left:1px solid #d5e5f8;border-right:0}
h3{font-size:13px;color:#6281a7}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#viewport{position:relative;min-width:0}
#game{width:100%;height:100%;display:block}
#explorer button{width:100%;text-align:left;margin:3px 0}
input{width:100%;padding:9px;border:1px solid #cbdcf0;border-radius:8px}
label{display:block;margin:12px 0 5px;font-size:12px}
#message{
 position:absolute;bottom:12px;left:12px;
 background:#174477;color:white;padding:10px;
 border-radius:8px;max-width:90%;font-size:12px;
}
@media(max-width:650px){
 main{grid-template-columns:115px 1fr}
 .right{display:none}
 .tools{grid-template-columns:1fr}
}
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
 }
}
</script>
</head>

<body>

<header>
 <div class="logo">BloxGo Studio</div>
 <button id="play">Play Test</button>
 <button id="stop" hidden>Stop</button>
 <button class="primary" id="publish">Publish</button>
</header>

<main>

<aside class="panel">
 <h3>Insert</h3>
 <div class="tools">
  <button id="part">Part</button>
  <button id="sphere">Sphere</button>
  <button id="cylinder">Cylinder</button>
  <button id="import">Import OBJ</button>
 </div>

 <input type="file" id="objfile" accept=".obj" hidden>

 <h3>Tools</h3>
 <div class="tools">
  <button id="move">Move</button>
  <button id="rotate">Rotate</button>
  <button id="scale">Scale</button>
  <button id="delete">Delete</button>
  <button id="duplicate">Duplicate</button>
 </div>

 <h3>Explorer</h3>
 <div id="explorer"></div>
</aside>

<section id="viewport">
 <canvas id="game"></canvas>
 <div id="message">BloxGo 3D Workspace</div>
</section>

<aside class="panel right">
 <h3>Properties</h3>

 <label>Name</label>
 <input id="objectName">

 <label>Position X</label>
 <input id="px" type="number" step=".1">

 <label>Position Y</label>
 <input id="py" type="number" step=".1">

 <label>Position Z</label>
 <input id="pz" type="number" step=".1">

 <label>Game Title</label>
 <input id="title" value="My BloxGo Game">
</aside>

</main>

<script type="module">

import * as THREE from "three";

import {OrbitControls}
from "three/addons/controls/OrbitControls.js";

import {TransformControls}
from "three/addons/controls/TransformControls.js";

import {OBJLoader}
from "three/addons/loaders/OBJLoader.js";

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 setDoc
}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={
 apiKey:"AIzaSyBui_UWCNABfF3wBYBMzi6Q5dLGvykfhaM",
 authDomain:"bloxgo-data.firebaseapp.com",
 projectId:"bloxgo-data",
 storageBucket:"bloxgo-data.firebasestorage.app",
 messagingSenderId:"905482130911",
 appId:"1:905482130911:web:273e391163a595ca32606a",
 measurementId:"G-4WYW9MNZ6Z"
};

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const db=getFirestore(firebaseApp);

let currentUser=null;

onAuthStateChanged(auth,user=>{
 currentUser=user;
});


/* THREE.JS */

const canvas=document.getElementById("game");

const renderer=new THREE.WebGLRenderer({
 canvas,
 antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xeaf4ff);

const camera=new THREE.PerspectiveCamera(
 60,1,0.1,1000
);

camera.position.set(9,8,11);

const orbit=new OrbitControls(camera,canvas);
orbit.enableDamping=true;
orbit.target.set(0,1,0);

scene.add(new THREE.HemisphereLight(
 0xffffff,0x8ba9cc,2
));

const light=new THREE.DirectionalLight(
 0xffffff,2
);

light.position.set(8,15,8);
scene.add(light);

const grid=new THREE.GridHelper(
 100,100,0x82aee0,0xcbdcf0
);

scene.add(grid);

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(1000,1000),
 new THREE.MeshStandardMaterial({color:0xf8fbff})
);

floor.rotation.x=-Math.PI/2;
floor.position.y=-0.05;
scene.add(floor);


const transform=new TransformControls(camera,canvas);
scene.add(transform.getHelper());

transform.addEventListener(
 "dragging-changed",
 e=>orbit.enabled=!e.value
);


let objects=[];
let selected=null;
let playing=false;
let player=null;
let velocity=0;

const clock=new THREE.Clock();


/* MESSAGE */

function message(text){
 document.getElementById("message").textContent=text;
}


/* OBJECT CREATION */

function createObject(type){

 let geometry;

 if(type==="Part")
  geometry=new THREE.BoxGeometry(2,2,2);

 if(type==="Sphere")
  geometry=new THREE.SphereGeometry(1,32,24);

 if(type==="Cylinder")
  geometry=new THREE.CylinderGeometry(1,1,2,32);

 const object=new THREE.Mesh(
  geometry,
  new THREE.MeshStandardMaterial({
   color:0x398be8
  })
 );

 object.name=type;
 object.position.set(0,1,0);

 scene.add(object);
 objects.push(object);

 selectObject(object);
 updateExplorer();

}


/* SELECTION */

function selectObject(object){

 selected=object;

 if(object)
  transform.attach(object);
 else
  transform.detach();

 updateExplorer();
 updateProperties();

}


/* EXPLORER */

function updateExplorer(){

 const explorer=document.getElementById("explorer");
 explorer.innerHTML="";

 objects.forEach(object=>{

  const button=document.createElement("button");

  button.textContent=object.name;

  button.onclick=()=>{
   selectObject(object);
  };

  explorer.appendChild(button);

 });

}


/* PROPERTIES */

function updateProperties(){

 if(!selected)return;

 document.getElementById("objectName").value=
 selected.name;

 document.getElementById("px").value=
 selected.position.x;

 document.getElementById("py").value=
 selected.position.y;

 document.getElementById("pz").value=
 selected.position.z;

}

function updatePosition(){

 if(!selected)return;

 selected.name=
 document.getElementById("objectName").value;

 selected.position.set(
  Number(document.getElementById("px").value)||0,
  Number(document.getElementById("py").value)||0,
  Number(document.getElementById("pz").value)||0
 );

 updateExplorer();

}

["objectName","px","py","pz"].forEach(id=>{
 document.getElementById(id).onchange=updatePosition;
});


/* BUTTONS */

document.getElementById("part").onclick=()=>{
 createObject("Part");
};

document.getElementById("sphere").onclick=()=>{
 createObject("Sphere");
};

document.getElementById("cylinder").onclick=()=>{
 createObject("Cylinder");
};

document.getElementById("move").onclick=()=>{
 transform.setMode("translate");
};

document.getElementById("rotate").onclick=()=>{
 transform.setMode("rotate");
};

document.getElementById("scale").onclick=()=>{
 transform.setMode("scale");
};

document.getElementById("delete").onclick=()=>{

 if(!selected)return;

 scene.remove(selected);
 objects=objects.filter(o=>o!==selected);

 selectObject(null);

};

document.getElementById("duplicate").onclick=()=>{

 if(!selected)return;

 const clone=selected.clone(true);

 clone.name=selected.name+" Copy";
 clone.position.x+=2;

 scene.add(clone);
 objects.push(clone);

 selectObject(clone);

};


/* OBJ IMPORT */

document.getElementById("import").onclick=()=>{
 document.getElementById("objfile").click();
};

document.getElementById("objfile").onchange=async event=>{

 const file=event.target.files[0];

 if(!file)return;

 try{

  const loader=new OBJLoader();
  const object=loader.parse(await file.text());

  object.name=file.name.replace(".obj","");

  object.traverse(child=>{

   if(child.isMesh){

    child.material=new THREE.MeshStandardMaterial({
     color:0x75a9e8
    });

   }

  });

  scene.add(object);
  objects.push(object);

  selectObject(object);

  message("OBJ imported");

 }catch(error){

  message("OBJ import failed: "+error.message);

 }

};


/* PLAYER */

function createPlayer(){

 const playerGroup=new THREE.Group();

 const colors=[
  0xffd34e,
  0x2879d8,
  0x45ad69
 ];

 function body(w,h,d,color,x,y,z){

  const mesh=new THREE.Mesh(
   new THREE.BoxGeometry(w,h,d),
   new THREE.MeshStandardMaterial({color})
  );

  mesh.position.set(x,y,z);
  playerGroup.add(mesh);

 }

 body(1.1,1.1,.6,colors[0],0,2.6,0);
 body(1.2,1.3,.6,colors[1],0,1.4,0);
 body(.45,1.1,.5,colors[2],-.3,.3,0);
 body(.45,1.1,.5,colors[2],.3,.3,0);

 return playerGroup;

}


/* PLAY TEST */

document.getElementById("play").onclick=()=>{

 if(playing)return;

 playing=true;

 player=createPlayer();
 player.position.set(0,0,3);

 scene.add(player);

 orbit.enabled=false;

 document.getElementById("play").hidden=true;
 document.getElementById("stop").hidden=false;

 message("Play Test: WASD to move, Space to jump");

};

document.getElementById("stop").onclick=()=>{

 playing=false;

 if(player)scene.remove(player);

 player=null;
 velocity=0;

 orbit.enabled=true;

 document.getElementById("play").hidden=false;
 document.getElementById("stop").hidden=true;

 message("Play Test stopped");

};


/* MOVEMENT */

const keys={};

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});

window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});


function updatePlayer(dt){

 if(!playing||!player)return;

 const direction=new THREE.Vector3(
  Number(keys.d)-Number(keys.a),
  0,
  Number(keys.s)-Number(keys.w)
 );

 if(direction.length()>1)direction.normalize();

 player.position.x+=direction.x*6*dt;
 player.position.z+=direction.z*6*dt;

 if(player.position.y<=0){

  player.position.y=0;

  if(keys[" "]){
   velocity=8;
  }

 }

 velocity-=20*dt;

 player.position.y=Math.max(
  0,
  player.position.y+velocity*dt
 );

 if(player.position.y===0)velocity=0;

 camera.position.lerp(
  player.position.clone().add(
   new THREE.Vector3(7,6,9)
  ),
  Math.min(1,dt*3)
 );

 camera.lookAt(
  player.position.x,
  player.position.y+2,
  player.position.z
 );

}


/* PUBLISH FIX */

function cleanForFirestore(value,seen=new WeakSet()){

 if(value===undefined)return null;

 if(value===null)return null;

 if(typeof value==="string"||
    typeof value==="boolean")return value;

 if(typeof value==="number")
  return Number.isFinite(value)?value:null;

 if(typeof value==="bigint")
  return value.toString();

 if(typeof value==="function"||
    typeof value==="symbol")return null;

 if(typeof value!=="object")return null;

 if(seen.has(value))return null;

 seen.add(value);

 if(Array.isArray(value)){

  const result=value.map(item=>
   cleanForFirestore(item,seen)
  );

  seen.delete(value);

  return result;

 }

 const result={};

 for(const [key,item] of Object.entries(value)){

  if(item!==undefined){

   result[key]=cleanForFirestore(item,seen);

  }

 }

 seen.delete(value);

 return result;

}


/* PUBLISH */

async function publishGame(){

 if(!currentUser){

  message("Sign in to BloxGo before publishing.");

  return;

 }

 const title=document.getElementById("title").value.trim();

 if(!title){

  message("Enter a game title.");

  return;

 }

 const button=document.getElementById("publish");

 button.disabled=true;
 button.textContent="Publishing...";

 try{

  const gameId="bg-"+crypto.randomUUID().replaceAll("-","");

  const gameRef=doc(
   db,
   "publishedGames",
   gameId
  );

  const rawData={

   title:title,

   ownerUid:currentUser.uid,

   scene:scene.toJSON(),

   createdAt:new Date().toISOString(),

   updatedAt:new Date().toISOString(),

   version:1

  };

  const gameData=cleanForFirestore(rawData);

  await setDoc(gameRef,gameData);

  const gameUrl=new URL(
   "play.html",
   window.location.href
  );

  gameUrl.searchParams.set("id",gameId);

  try{

   if(navigator.clipboard?.writeText){

    await navigator.clipboard.writeText(
     gameUrl.href
    );

   }

  }catch(error){

   console.warn("Clipboard unavailable",error);

  }

  message("Published successfully! "+gameUrl.href);

  button.textContent="Published";

 }catch(error){

  console.error(error);

  message(
   "Publish failed: "+(error.message||String(error))
  );

  button.textContent="Publish";

 }finally{

  button.disabled=false;

 }

}

document.getElementById("publish").onclick=publishGame;


/* RESIZE */

function resize(){

 const width=canvas.clientWidth;
 const height=canvas.clientHeight;

 if(!width||!height)return;

 renderer.setSize(width,height,false);

 camera.aspect=width/height;
 camera.updateProjectionMatrix();

}

new ResizeObserver(resize).observe(canvas);


/* RENDER */

function animate(){

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.05);

 if(playing)updatePlayer(dt);

 orbit.update();

 renderer.render(scene,camera);

}

createObject("Part");

animate();

</script>
</body>
  </html>
