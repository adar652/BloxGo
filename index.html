
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BloxGo</title>
<style>
:root {
  color-scheme: dark;
  --bg: #07111f;
  --panel: #101f35;
  --panel2: #172b47;
  --blue: #3988ff;
  --text: #edf5ff;
  --muted: #9eb2ce;
  --border: #29415f;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, Arial, sans-serif;
  background: radial-gradient(ellipse at top, #163761, var(--bg) 65%);
  color: var(--text);
  min-height: 100vh;
}
header {
  position: sticky;
  top: 0;
  z-index: 5;
  padding: 16px;
  background: #091629ed;
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.header-row {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.brand { font-size: 26px; font-weight: 900; color: #69aaff; }
.wallet { display: flex; gap: 10px; flex-wrap: wrap; }
.balance {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 9px 12px;
}
.balance img { width: 20px; height: 20px; object-fit: contain; vertical-align: middle; }
nav {
  max-width: 1100px;
  margin: 14px auto 0;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
button, input {
  font: inherit;
  border-radius: 10px;
}
button {
  cursor: pointer;
  color: white;
  background: var(--panel2);
  border: 1px solid var(--border);
  padding: 10px 14px;
}
button:hover { border-color: #66a5ff; background: #203d62; }
button.primary { background: var(--blue); border-color: var(--blue); }
main { max-width: 1100px; margin: 24px auto; padding: 0 16px 50px; }
.panel {
  background: linear-gradient(145deg, #132742, #0b192c);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 12px 35px #0002;
}
h1, h2 { margin-top: 0; }
p, .muted { color: var(--muted); }
input {
  width: 100%;
  color: white;
  background: #071426;
  border: 1px solid var(--border);
  padding: 12px;
  margin: 6px 0 12px;
}
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}
.hidden { display: none !important; }
#status { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="brand">BloxGo</div>
    <div id="wallet" class="wallet hidden">
      <div class="balance">
        <img src="Content/Icons/Robux_Icon.png" alt="Robux">
        <strong id="robuxBalance">0</strong>
      </div>
      <div class="balance">
        <img src="Content/Icons/Tix.png" alt="Tix">
        <strong id="tixBalance">0</strong>
      </div>
    </div>
    <button id="logoutButton" class="hidden">Log Out</button>
  </div>
  <nav>
    <button data-page="Home">Home</button>
    <button data-page="Games">Games</button>
    <button data-page="Servers">Servers</button>
    <button data-page="Catalog">Catalog</button>
    <button data-page="Inventory">Inventory</button>
    <button data-page="Avatar">Avatar</button>
    <button data-page="Earn">Earn</button>
    <button data-page="Exchange">Exchange</button>
    <button data-page="Users">Users</button>
    <button data-page="Account">Account</button>
  </nav>
</header>

<main>
  <section id="accountPanel" class="panel">
    <h1>BloxGo Account</h1>
    <p>Sign in or create your BloxGo account.</p>
    <label for="username">Username</label>
    <input id="username" autocomplete="username" maxlength="20"
           placeholder="Enter username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password"
           placeholder="Enter password">
    <div class="actions">
      <button id="loginButton" class="primary">Log In</button>
      <button id="registerButton">Create Account</button>
    </div>
    <p id="status" role="status"></p>
  </section>

  <section id="page" class="panel">
    <h1>Welcome to BloxGo</h1>
    <p>Sign in to load your account balance.</p>
  </section>
</main>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  runTransaction,
  collection,
  query,
  where,
  orderBy,
  limit,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBui_UWCNABfF3wBYBMzi6Q5dLGvykfhaM",
  authDomain: "bloxgo-data.firebaseapp.com",
  projectId: "bloxgo-data",
  storageBucket: "bloxgo-data.firebasestorage.app",
  messagingSenderId: "905482130911",
  appId: "1:905482130911:web:273e391163a595ca32606a",
  measurementId: "G-4WYW9MNZ6Z"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
let currentUser = null;
let currentUsername = "";
let currentPage = "Home";
let robux = 0;
let tix = 0;
let balanceLoaded = false;

function setStatus(message) {
  $("status").textContent = message;
}

function validUsername(name) {
  return /^[a-zA-Z0-9_]{3,20}$/.test(name);
}

async function emailFor(username) {
  const bytes = new TextEncoder().encode(
    username.toLowerCase() + "|bloxgo-username-v1"
  );
  const hash = await crypto.subtle.digest("SHA-256", bytes);
  const hex = [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2, "0")).join("");
  return "u-" + hex + "@users.bloxgo.invalid";
}

function hideBalances() {
  balanceLoaded = false;
  robux = 0;
  tix = 0;
  $("wallet").classList.add("hidden");
  $("robuxBalance").textContent = "—";
  $("tixBalance").textContent = "—";
}

function showBalances() {
  if (!currentUser || !balanceLoaded) return;
  $("wallet").classList.remove("hidden");
  $("robuxBalance").textContent = String(robux);
  $("tixBalance").textContent = String(tix);
}

async function loadBalances(user) {
  hideBalances();
  const snap = await getDoc(doc(db, "users", user.uid));

  if (!snap.exists()) {
    throw new Error("Account data not found in Firestore.");
  }

  const data = snap.data();
  currentUsername = data.username || user.displayName || "";
  robux = Number.isFinite(Number(data.robux)) ? Number(data.robux) : 0;
  tix = Number.isFinite(Number(data.tix)) ? Number(data.tix) : 0;
  balanceLoaded = true;
  showBalances();
}

async function register() {
  const username = $("username").value.trim();
  const password = $("password").value;

  if (!validUsername(username)) {
    throw new Error("Username must be 3–20 letters, numbers, or underscores.");
  }
  if (password.length < 6) {
    throw new Error("Password must contain at least 6 characters.");
  }

  const email = await emailFor(username);
  const credential = await createUserWithEmailAndPassword(auth, email, password);
  const user = credential.user;
  const usernameLower = username.toLowerCase();
  const usernameRef = doc(db, "usernames", usernameLower);
  const userRef = doc(db, "users", user.uid);

  try {
    await runTransaction(db, async tx => {
      const existing = await tx.get(usernameRef);
      if (existing.exists()) throw new Error("That username is already taken.");

      tx.set(usernameRef, {
        uid: user.uid,
        username,
        usernameLower
      });

      tx.set(userRef, {
        username,
        usernameLower,
        createdAt: new Date().toISOString(),
        robux: 100,
        tix: 25
      });
    });
    setStatus("Account created successfully.");
  } catch (error) {
    await signOut(auth);
    throw error;
  }
}

async function login() {
  const username = $("username").value.trim();
  const password = $("password").value;

  if (!validUsername(username)) {
    throw new Error("Enter a valid username.");
  }
  if (!password) throw new Error("Enter your password.");

  const email = await emailFor(username);
  await signInWithEmailAndPassword(auth, email, password);
}

function runAction(action) {
  if (!currentUser || !balanceLoaded) {
    setStatus("Please log in to use account features.");
    return;
  }
  if (action === "Earn") {
    $("page").innerHTML = `
      <h1>Earn</h1>
      <p>Welcome reward: earn 25 Tix once per account.</p>
      <button id="welcomeReward" class="primary">Claim Welcome Reward</button>
      <p id="earnStatus"></p>`;
    $("welcomeReward").onclick = () =>
      claimReward("welcomeRewardClaimed", 25);
    return;
  }
  if (action === "Exchange") {
    $("page").innerHTML = `
      <h1>Exchange</h1>
      <p>Exchange rate: 10 Tix = 5 Robux.</p>
      <label for="exchangeAmount">Tix amount (multiples of 10)</label>
      <input id="exchangeAmount" type="number" min="10" step="10" value="10">
      <button id="exchangeButton" class="primary">Exchange</button>
      <p id="exchangeStatus"></p>`;
    $("exchangeButton").onclick = exchangeTix;
    return;
  }
  if (action === "Account") {
    $("page").innerHTML = `
      <h1>Account</h1>
      <p>Username: ${escapeHtml(currentUsername)}</p>
      <p>Robux: ${robux} | Tix: ${tix}</p>
      <button id="accountLogout">Log Out</button>`;
    $("accountLogout").onclick = () => signOut(auth);
    return;
  }
  setStatus("Signed in as " + currentUsername + ".");
}

async function claimReward(field, amount) {
  const userRef = doc(db, "users", currentUser.uid);
  try {
    await runTransaction(db, async tx => {
      const snap = await tx.get(userRef);
      if (!snap.exists()) throw new Error("Account data missing.");
      if (snap.data()[field]) throw new Error("This reward was already claimed.");
      tx.update(userRef, {
        tix: Number(snap.data().tix || 0) + amount,
        [field]: true
      });
    });
    await loadBalances(currentUser);
    $("earnStatus").textContent = "Reward claimed!";
  } catch (error) {
    $("earnStatus").textContent = error.message;
  }
}

async function exchangeTix() {
  const amount = Number($("exchangeAmount").value);
  const status = $("exchangeStatus");

  if (!Number.isInteger(amount) || amount < 10 || amount % 10 !== 0) {
    status.textContent = "Enter a multiple of 10 Tix.";
    return;
  }

  const userRef = doc(db, "users", currentUser.uid);
  try {
    await runTransaction(db, async tx => {
      const snap = await tx.get(userRef);
      if (!snap.exists()) throw new Error("Account data missing.");
      const data = snap.data();
      const oldTix = Number(data.tix || 0);
      const oldRobux = Number(data.robux || 0);

      if (oldTix < amount) throw new Error("Not enough Tix.");

      tx.update(userRef, {
        tix: oldTix - amount,
        robux: oldRobux + (amount / 2)
      });
    });
    await loadBalances(currentUser);
    status.textContent = "Exchange complete.";
  } catch (error) {
    status.textContent = error.message;
  }
}

async function searchUsers() {
  if (!currentUser) {
    $("page").innerHTML = "<h1>Users</h1><p>Please log in to search users.</p>";
    return;
  }

  $("page").innerHTML = `
    <h1>Users</h1>
    <input id="userSearch" placeholder="Search username">
    <button id="searchButton" class="primary">Search</button>
    <div id="userResults"></div>`;

  $("searchButton").onclick = async () => {
    const term = $("userSearch").value.trim().toLowerCase();
    const results = $("userResults");
    if (!term) {
      results.textContent = "Enter a username.";
      return;
    }
    try {
      const q = query(
        collection(db, "usernames"),
        where("usernameLower", ">=", term),
        where("usernameLower", "<=", term + "\uf8ff"),
        orderBy("usernameLower"),
        limit(20)
      );
      const snap = await getDocs(q);
      results.replaceChildren();
      if (snap.empty) {
        results.textContent = "No users found.";
        return;
      }
      snap.forEach(item => {
        const p = document.createElement("p");
        p.textContent = item.data().username;
        results.appendChild(p);
      });
    } catch (error) {
      results.textContent = "Search failed: " + error.message;
    }
  };
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[char]);
}

function showPage(pageName) {
  currentPage = pageName;
  if (pageName === "Users") {
    searchUsers();
    return;
  }

  if (pageName === "Games") {
    $("page").innerHTML = "<h1>Games</h1><div id='gameGrid' class='grid'></div>";
    loadGames();
    return;
  }

  if (pageName === "Catalog") {
    $("page").innerHTML = `
      <h1>Catalog</h1>
      <div class="grid">
        <article class="panel">
          <img src="Content/Faces/smile.png" alt="Smile face" width="90">
          <h2>Smile</h2><p>Free face</p>
        </article>
        <article class="panel">
          <img src="Content/Faces/epicface.png" alt="Epic Face" width="90">
          <h2>Epic Face</h2><p>79 Robux</p>
          <button id="buyEpic" class="primary">Buy</button>
          <p id="catalogStatus"></p>
        </article>
      </div>`;
    $("buyEpic").onclick = () => {
      $("catalogStatus").textContent =
        "Catalog purchases need a secure server-side purchase handler.";
    };
    return;
  }

  if (pageName === "Inventory" || pageName === "Avatar") {
    if (!currentUser) {
      $("page").innerHTML = `<h1>${pageName}</h1><p>Please log in first.</p>`;
      return;
    }
    $("page").innerHTML = `
      <h1>${pageName}</h1>
      <p>Face inventory and equipment will be connected to your account next.</p>`;
    return;
  }

  if (pageName === "Servers") {
    $("page").innerHTML = `
      <h1>Servers</h1>
      <p>Add a server address to open a supported web destination.</p>
      <input id="serverAddress" placeholder="https://example.com">
      <button id="connectServer" class="primary">Connect</button>
      <p id="serverStatus"></p>`;
    $("connectServer").onclick = () => {
      const raw = $("serverAddress").value.trim();
      try {
        const url = new URL(raw);
        if (url.protocol !== "https:" && url.protocol !== "http:") {
          throw new Error("Only HTTP and HTTPS addresses are supported.");
        }
        window.open(url.href, "_blank", "noopener,noreferrer");
      } catch (error) {
        $("serverStatus").textContent = "Enter a valid web address.";
      }
    };
    return;
  }

  if (pageName === "Earn" || pageName === "Exchange" ||
      pageName === "Account") {
    runAction(pageName);
    return;
  }

  $("page").innerHTML = `
    <h1>Welcome to BloxGo</h1>
    <p>Discover games, customize your avatar, and explore BloxGo.</p>
    <p>${currentUser ? "Signed in as " + escapeHtml(currentUsername) :
      "Log in to load your Robux and Tix balances."}</p>`;
}

async function loadGames() {
  const grid = $("gameGrid");
  if (!grid) return;

  try {
    const response = await fetch("games.json");
    if (!response.ok) throw new Error("Could not load games.json");
    const games = await response.json();

    grid.replaceChildren();
    for (const game of games) {
      const folder = String(game.folder || game.name);
      const card = document.createElement("article");
      card.className = "panel";
      const image = document.createElement("img");
      image.src = `Games/${encodeURIComponent(folder)}/thumbnail.png`;
      image.alt = game.name + " thumbnail";
      image.style.cssText = "width:100%;height:130px;object-fit:cover;border-radius:10px";

      const logo = document.createElement("img");
      logo.src = `Games/${encodeURIComponent(folder)}/logo.png`;
      logo.alt = game.name + " logo";
      logo.style.cssText = "width:48px;height:48px;object-fit:contain;vertical-align:middle";
      logo.onerror = () => logo.remove();

      const title = document.createElement("h2");
      title.textContent = game.name;

      const play = document.createElement("button");
      play.className = "primary";
      play.textContent = "Play";
      play.onclick = () => {
        location.href = `Games/${encodeURIComponent(folder)}/index.html`;
      };

      card.append(image, logo, title, play);
      grid.appendChild(card);
    }
  } catch (error) {
    grid.textContent = "Games could not be loaded. Check games.json and the Games folder.";
  }
}

$("loginButton").onclick = async () => {
  try {
    setStatus("Logging in...");
    await login();
    setStatus("Login successful.");
  } catch (error) {
    setStatus(error.message);
  }
};

$("registerButton").onclick = async () => {
  try {
    setStatus("Creating account...");
    await register();
  } catch (error) {
    setStatus(error.message);
  }
};

$("logoutButton").onclick = () => signOut(auth);

document.querySelectorAll("nav button").forEach(button => {
  button.onclick = () => showPage(button.dataset.page);
});

onAuthStateChanged(auth, async user => {
  currentUser = user;
  hideBalances();
  $("logoutButton").classList.toggle("hidden", !user);
  $("accountPanel").classList.toggle("hidden", !!user);

  if (!user) {
    currentUsername = "";
    if (currentPage !== "Games" && currentPage !== "Catalog" &&
        currentPage !== "Servers") {
      $("page").innerHTML = `
        <h1>Welcome to BloxGo</h1>
        <p>Log in to load your account balances.</p>`;
    }
    return;
  }

  try {
    await loadBalances(user);
    if (currentPage === "Home" || currentPage === "Account") {
      showPage(currentPage);
    }
  } catch (error) {
    setStatus("Could not load account balance: " + error.message);
  }
});

showPage("Home");
</script>
</body>
</html>
