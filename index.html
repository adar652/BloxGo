
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BloxGo</title>
<style>
:root{
  color-scheme:dark;
  --bg:#050b17;--panel:#122541;--panel2:#1a3456;
  --blue:#368cff;--cyan:#65d5ff;--text:#f1f7ff;
  --muted:#9aafcc;--border:#294b73;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:system-ui,Arial,sans-serif;
  color:var(--text);
  background:
  radial-gradient(ellipse at 15% 0%,#164d83,transparent 38%),
  radial-gradient(ellipse at 90% 35%,#102d55,transparent 35%),
  var(--bg);
}
header{
  position:sticky;top:0;z-index:10;padding:14px 18px;
  background:#071326ed;border-bottom:1px solid #31557d;
  backdrop-filter:blur(20px);box-shadow:0 8px 30px #0005;
}
.header-row{
  max-width:1150px;margin:auto;display:flex;
  justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
}
.brand{font-size:30px;font-weight:1000;letter-spacing:-1.5px}
.brand span{color:#55a9ff}
.wallet{display:flex;gap:10px;flex-wrap:wrap}
.balance{
  display:flex;align-items:center;gap:8px;padding:9px 14px;
  border:1px solid #365d8b;border-radius:13px;
  background:linear-gradient(135deg,#1b3659,#10213a);
}
.balance img{width:22px;height:22px;object-fit:contain}
nav{
  max-width:1150px;margin:15px auto 0;display:flex;gap:8px;
  overflow-x:auto;padding-bottom:3px;
}
button{
  cursor:pointer;color:var(--text);
  background:linear-gradient(145deg,#1a3150,#10213a);
  border:1px solid #315174;border-radius:12px;
  padding:10px 14px;font:inherit;font-weight:650;transition:.2s;
}
button:hover{
  transform:translateY(-2px);border-color:#66b4ff;
  background:linear-gradient(145deg,#28558b,#18385f);
  box-shadow:0 5px 18px #167aff35;
}
button.primary{
  background:linear-gradient(135deg,#168aff,#3865ff);
  border-color:#65baff;
}
nav button{display:flex;align-items:center;gap:9px;white-space:nowrap}
nav button img{width:23px;height:23px;object-fit:contain}
#refreshButton{background:#153b68}
main{max-width:1150px;margin:30px auto;padding:0 16px 60px}
.panel{
  padding:24px;margin-bottom:18px;border:1px solid #294b73;
  border-radius:20px;background:linear-gradient(145deg,#152b49ef,#0a172aef);
  box-shadow:0 15px 45px #0004,inset 0 1px #ffffff12;
}
h1{font-size:30px;letter-spacing:-1px;margin-top:0}
h2{margin-top:8px}
p{color:var(--muted)}
input{
  display:block;width:100%;padding:13px;margin:7px 0 15px;
  color:white;background:#071426;border:1px solid #355477;
  border-radius:11px;font:inherit;
}
input:focus{border-color:#59aaff;outline:none}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.hidden{display:none!important}
.game-card,.item-card{
  overflow:hidden;padding:14px;border-radius:17px;
  border:1px solid #315174;background:#10233d;
}
.thumbnail{width:100%;height:145px;object-fit:cover;border-radius:12px}
.game-logo{width:48px;height:48px;object-fit:contain;vertical-align:middle;margin-right:8px}
.face-image{
  width:110px;height:110px;object-fit:contain;
  display:block;margin:12px auto;
}
.item-card{text-align:center}
.item-card button{width:100%;margin-top:8px}
.tag{
  display:inline-block;padding:5px 9px;border-radius:8px;
  background:#1c4775;color:#b8ddff;font-size:12px;
}
#status{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
 <div class="header-row">
  <div class="brand">Blox<span>Go</span></div>
  <div id="wallet" class="wallet hidden">
   <div class="balance">
    <img src="Content/Icons/Robux_Icon.png" alt="Robux">
    <strong id="robuxBalance">—</strong>
   </div>
   <div class="balance">
    <img src="Content/Icons/Tix.png" alt="Tix">
    <strong id="tixBalance">—</strong>
   </div>
  </div>
  <button id="logoutButton" class="hidden">Log Out</button>
 </div>
 <nav>
  <button data-page="Home">Home</button>
  <button data-page="Games"><img src="Content/Icons/games_icon.png" alt="">Games</button>
  <button data-page="Servers"><img src="Content/Icons/servers_icon.png" alt="">Servers</button>
  <button data-page="Catalog">Catalog</button>
  <button data-page="Inventory">Inventory</button>
  <button data-page="Avatar">Avatar</button>
  <button data-page="Earn">Earn</button>
  <button data-page="Exchange">Exchange</button>
  <button data-page="Users">Users</button>
  <button data-page="Account">Account</button>
  <button id="refreshButton"><img src="Content/Icons/refresh_icon.png" alt="">Refresh</button>
 </nav>
</header>

<main>
 <section id="accountPanel" class="panel">
  <h1>BloxGo Account</h1>
  <p>Sign in or create your BloxGo account.</p>
  <label for="username">Username</label>
  <input id="username" autocomplete="username" maxlength="20" placeholder="Enter username">
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Enter password">
  <div class="actions">
   <button id="loginButton" class="primary">Log In</button>
   <button id="registerButton">Create Account</button>
  </div>
  <p id="status" role="status"></p>
 </section>
 <section id="page" class="panel">
  <h1>Welcome to BloxGo</h1>
  <p>Your games. Your world.</p>
 </section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import {
 getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,
 signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
import {
 getFirestore,doc,getDoc,runTransaction,collection,query,
 where,orderBy,limit,getDocs
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyBui_UWCNABfF3wBYBMzi6Q5dLGvykfhaM",
 authDomain:"bloxgo-data.firebaseapp.com",
 projectId:"bloxgo-data",
 storageBucket:"bloxgo-data.firebasestorage.app",
 messagingSenderId:"905482130911",
 appId:"1:905482130911:web:273e391163a595ca32606a",
 measurementId:"G-4WYW9MNZ6Z"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

let currentUser=null;
let currentUsername="";
let currentPage="Home";
let robux=0,tix=0,balanceLoaded=false;
let inventory=[];
let equippedFace="smile";

const faces={
 smile:{name:"Smile",image:"Content/Faces/smile.png",price:0},
 epicface:{name:"Epic Face",image:"Content/Faces/epicface.png",price:79}
};

function status(message){$("status").textContent=message}
function validUsername(s){return /^[a-zA-Z0-9_]{3,20}$/.test(s)}
function escapeHtml(v){
 return String(v).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

async function emailFor(username){
 const bytes=new TextEncoder().encode(username.toLowerCase()+"|bloxgo-username-v1");
 const hash=await crypto.subtle.digest("SHA-256",bytes);
 const hex=[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");
 return "u-"+hex+"@users.bloxgo.invalid";
}

function hideBalances(){
 balanceLoaded=false;robux=0;tix=0;
 $("wallet").classList.add("hidden");
 $("robuxBalance").textContent="—";
 $("tixBalance").textContent="—";
}
function showBalances(){
 if(!currentUser||!balanceLoaded)return;
 $("wallet").classList.remove("hidden");
 $("robuxBalance").textContent=String(robux);
 $("tixBalance").textContent=String(tix);
}

async function loadAccount(user){
 hideBalances();
 const snap=await getDoc(doc(db,"users",user.uid));
 if(!snap.exists())throw new Error("Account data not found.");
 const data=snap.data();
 currentUsername=data.username||"";
 robux=Number(data.robux??0);
 tix=Number(data.tix??0);
 inventory=Array.isArray(data.inventory)?data.inventory:["smile"];
 if(!inventory.includes("smile"))inventory.push("smile");
 equippedFace=faces[data.equippedFace]?data.equippedFace:"smile";
 balanceLoaded=true;
 showBalances();
}

async function register(){
 const username=$("username").value.trim();
 const password=$("password").value;
 if(!validUsername(username))throw new Error("Username must be 3–20 letters, numbers, or underscores.");
 if(password.length<6)throw new Error("Password must contain at least 6 characters.");

 const email=await emailFor(username);
 const credential=await createUserWithEmailAndPassword(auth,email,password);
 const user=credential.user;
 const lower=username.toLowerCase();

 try{
  await runTransaction(db,async tx=>{
   const nameRef=doc(db,"usernames",lower);
   const existing=await tx.get(nameRef);
   if(existing.exists())throw new Error("Username already taken.");
   tx.set(nameRef,{uid:user.uid,username,usernameLower:lower});
   tx.set(doc(db,"users",user.uid),{
    username,usernameLower:lower,
    createdAt:new Date().toISOString(),
    robux:100,tix:25,
    inventory:["smile"],
    equippedFace:"smile"
   });
  });
  status("Account created successfully.");
 }catch(e){
  await signOut(auth);
  throw e;
 }
}

async function login(){
 const username=$("username").value.trim();
 const password=$("password").value;
 if(!validUsername(username))throw new Error("Enter a valid username.");
 if(!password)throw new Error("Enter your password.");
 await signInWithEmailAndPassword(auth,await emailFor(username),password);
}

async function purchaseFace(id){
 if(!currentUser||!balanceLoaded){alert("Please log in first.");return}
 const face=faces[id];
 if(!face)return;
 if(inventory.includes(id)){alert("You already own this face.");return}

 try{
  await runTransaction(db,async tx=>{
   const ref=doc(db,"users",currentUser.uid);
   const snap=await tx.get(ref);
   if(!snap.exists())throw new Error("Account not found.");
   const data=snap.data();
   const owned=Array.isArray(data.inventory)?data.inventory:["smile"];
   if(owned.includes(id))throw new Error("You already own this face.");
   const balance=Number(data.robux||0);
   if(balance<face.price)throw new Error("Not enough Robux.");

   tx.update(ref,{
    robux:balance-face.price,
    inventory:[...owned,id]
   });
  });
  await loadAccount(currentUser);
  showPage("Catalog");
  alert(face.name+" purchased successfully!");
 }catch(e){alert(e.message)}
}

async function equipFace(id){
 if(!currentUser||!balanceLoaded)return;
 if(!faces[id])return;
 try{
  await runTransaction(db,async tx=>{
   const ref=doc(db,"users",currentUser.uid);
   const snap=await tx.get(ref);
   if(!snap.exists())throw new Error("Account not found.");
   const owned=snap.data().inventory||["smile"];
   if(!owned.includes(id))throw new Error("You do not own this face.");
   tx.update(ref,{equippedFace:id});
  });
  await loadAccount(currentUser);
  showPage("Avatar");
 }catch(e){alert(e.message)}
}

function renderCatalog(){
 const cards=Object.entries(faces).map(([id,face])=>{
  const owned=inventory.includes(id);
  return `<article class="item-card">
   <img class="face-image" src="${face.image}" alt="${face.name}">
   <h2>${face.name}</h2>
   <p>${face.price===0?"Free":face.price+" Robux"}</p>
   <span class="tag">${owned?"Owned": "Catalog Item"}</span>
   <button class="primary" data-buy="${id}" ${owned?"disabled":""}>
    ${owned?"Owned":face.price===0?"Get":"Buy"}
   </button>
  </article>`;
 }).join("");
 $("page").innerHTML=`<h1>Catalog</h1><p>Discover faces for your avatar.</p><div class="grid">${cards}</div>`;
 $("page").querySelectorAll("[data-buy]").forEach(b=>{
  b.onclick=()=>purchaseFace(b.dataset.buy);
 });
}

function renderInventory(){
 if(!currentUser){
  $("page").innerHTML="<h1>Inventory</h1><p>Please log in first.</p>";return;
 }
 const cards=inventory.map(id=>{
  const face=faces[id];
  if(!face)return "";
  return `<article class="item-card">
   <img class="face-image" src="${face.image}" alt="${face.name}">
   <h2>${face.name}</h2>
   <span class="tag">${equippedFace===id?"Equipped":"Owned"}</span>
   <button data-equip="${id}" ${equippedFace===id?"disabled":""}>
    ${equippedFace===id?"Equipped":"Equip"}
   </button>
  </article>`;
 }).join("");
 $("page").innerHTML=`<h1>Inventory</h1><p>Your owned faces.</p><div class="grid">${cards}</div>`;
 $("page").querySelectorAll("[data-equip]").forEach(b=>{
  b.onclick=()=>equipFace(b.dataset.equip);
 });
}

function renderAvatar(){
 if(!currentUser){
  $("page").innerHTML="<h1>Avatar</h1><p>Please log in first.</p>";return;
 }
 const face=faces[equippedFace]||faces.smile;
 $("page").innerHTML=`
  <h1>Avatar</h1>
  <div class="item-card" style="max-width:330px;margin:auto">
   <img class="face-image" src="${face.image}" alt="${face.name}">
   <h2>${escapeHtml(currentUsername)}</h2>
   <p>Equipped Face: ${face.name}</p>
   <span class="tag">Your BloxGo Avatar</span>
  </div>`;
}

async function claimReward(){
 const ref=doc(db,"users",currentUser.uid);
 try{
  await runTransaction(db,async tx=>{
   const snap=await tx.get(ref);
   if(!snap.exists())throw new Error("Account missing.");
   if(snap.data().welcomeRewardClaimed)throw new Error("Already claimed.");
   tx.update(ref,{
    tix:Number(snap.data().tix||0)+25,
    welcomeRewardClaimed:true
   });
  });
  await loadAccount(currentUser);
  $("earnStatus").textContent="Reward claimed!";
 }catch(e){$("earnStatus").textContent=e.message}
}

async function exchangeTix(){
 const amount=Number($("exchangeAmount").value);
 const out=$("exchangeStatus");
 if(!Number.isInteger(amount)||amount<10||amount%10!==0){
  out.textContent="Enter a multiple of 10 Tix.";return;
 }
 const ref=doc(db,"users",currentUser.uid);
 try{
  await runTransaction(db,async tx=>{
   const snap=await tx.get(ref);
   if(!snap.exists())throw new Error("Account missing.");
   const data=snap.data();
   const oldTix=Number(data.tix||0);
   if(oldTix<amount)throw new Error("Not enough Tix.");
   tx.update(ref,{
    tix:oldTix-amount,
    robux:Number(data.robux||0)+amount/2
   });
  });
  await loadAccount(currentUser);
  out.textContent="Exchange complete.";
 }catch(e){out.textContent=e.message}
}

async function searchUsers(){
 if(!currentUser){
  $("page").innerHTML="<h1>Users</h1><p>Please log in first.</p>";return;
 }
 $("page").innerHTML=`
  <h1>Users</h1><input id="userSearch" placeholder="Search username">
  <button id="searchButton" class="primary">Search</button>
  <div id="userResults"></div>`;
 $("searchButton").onclick=async()=>{
  const term=$("userSearch").value.trim().toLowerCase();
  const results=$("userResults");
  if(!term){results.textContent="Enter a username.";return}
  try{
   const q=query(collection(db,"usernames"),
    where("usernameLower",">=",term),
    where("usernameLower","<=",term+"\uf8ff"),
    orderBy("usernameLower"),limit(20));
   const snap=await getDocs(q);
   results.replaceChildren();
   if(snap.empty){results.textContent="No users found.";return}
   snap.forEach(item=>{
    const p=document.createElement("p");
    p.textContent=item.data().username;
    results.appendChild(p);
   });
  }catch(e){results.textContent="Search failed: "+e.message}
 };
}

async function loadGames(){
 const grid=$("gameGrid");
 if(!grid)return;
 try{
  const response=await fetch("games.json");
  if(!response.ok)throw new Error();
  const games=await response.json();
  grid.replaceChildren();
  games.forEach(game=>{
   const folder=String(game.folder||game.name);
   const card=document.createElement("article");
   card.className="game-card";
   const image=document.createElement("img");
   image.className="thumbnail";
   image.src=`Games/${encodeURIComponent(folder)}/thumbnail.png`;
   image.alt=game.name+" thumbnail";
   const logo=document.createElement("img");
   logo.className="game-logo";
   logo.src=`Games/${encodeURIComponent(folder)}/logo.png`;
   logo.alt=game.name+" logo";
   logo.onerror=()=>logo.remove();
   const title=document.createElement("h2");
   title.append(logo,document.createTextNode(game.name));
   const play=document.createElement("button");
   play.className="primary";play.textContent="Play";
   play.onclick=()=>location.href=`Games/${encodeURIComponent(folder)}/index.html`;
   card.append(image,title,play);grid.appendChild(card);
  });
 }catch(e){grid.textContent="Games could not be loaded. Check games.json."}
}

function showPage(name){
 currentPage=name;
 const page=$("page");

 if(name==="Games"){
  page.innerHTML='<h1>Games</h1><div id="gameGrid" class="grid"></div>';
  loadGames();return;
 }
 if(name==="Catalog"){renderCatalog();return}
 if(name==="Inventory"){renderInventory();return}
 if(name==="Avatar"){renderAvatar();return}
 if(name==="Users"){searchUsers();return}

 if(name==="Servers"){
  page.innerHTML=`
   <h1>Servers</h1><p>Connect to a web server.</p>
   <input id="serverAddress" placeholder="https://example.com">
   <button id="connectServer" class="primary">Connect</button>
   <p id="serverStatus"></p>`;
  $("connectServer").onclick=()=>{
   try{
    const url=new URL($("serverAddress").value.trim());
    if(!["https:","http:"].includes(url.protocol))throw new Error();
    window.open(url.href,"_blank","noopener,noreferrer");
   }catch(e){$("serverStatus").textContent="Enter a valid web address."}
  };
  return;
 }

 if(name==="Earn"){
  if(!currentUser){page.innerHTML="<h1>Earn</h1><p>Please log in first.</p>";return}
  page.innerHTML=`
   <h1>Earn</h1><p>Welcome reward: 25 Tix, once per account.</p>
   <button id="welcomeReward" class="primary">Claim Reward</button>
   <p id="earnStatus"></p>`;
  $("welcomeReward").onclick=claimReward;return;
 }

 if(name==="Exchange"){
  if(!currentUser){page.innerHTML="<h1>Exchange</h1><p>Please log in first.</p>";return}
  page.innerHTML=`
   <h1>Exchange</h1><p>10 Tix = 5 Robux</p>
   <input id="exchangeAmount" type="number" min="10" step="10" value="10">
   <button id="exchangeButton" class="primary">Exchange</button>
   <p id="exchangeStatus"></p>`;
  $("exchangeButton").onclick=exchangeTix;return;
 }

 if(name==="Account"){
  page.innerHTML=currentUser?`
   <h1>Account</h1><p>Username: ${escapeHtml(currentUsername)}</p>
   <p>Robux: ${robux} | Tix: ${tix}</p>
   <button id="accountLogout">Log Out</button>`:
   "<h1>Account</h1><p>Please log in.</p>";
  if($("accountLogout"))$("accountLogout").onclick=()=>signOut(auth);
  return;
 }

 page.innerHTML=`
  <h1>Welcome to BloxGo</h1>
  <p>Your games. Your world.</p>
  <p>${currentUser?"Signed in as "+escapeHtml(currentUsername):
  "Log in to load your Robux and Tix balances."}</p>`;
}

$("loginButton").onclick=async()=>{
 try{status("Logging in...");await login();status("Login successful.")}
 catch(e){status(e.message)}
};
$("registerButton").onclick=async()=>{
 try{status("Creating account...");await register()}
 catch(e){status(e.message)}
};
$("logoutButton").onclick=()=>signOut(auth);

document.querySelectorAll("nav button[data-page]").forEach(b=>{
 b.onclick=()=>showPage(b.dataset.page);
});

$("refreshButton").onclick=async()=>{
 if(currentUser){
  try{await loadAccount(currentUser)}
  catch(e){status(e.message)}
 }
 showPage(currentPage);
};

onAuthStateChanged(auth,async user=>{
 currentUser=user;
 hideBalances();
 $("logoutButton").classList.toggle("hidden",!user);
 $("accountPanel").classList.toggle("hidden",!!user);
 if(!user){
  currentUsername="";inventory=[];equippedFace="smile";
  if(!["Games","Catalog","Servers"].includes(currentPage))showPage("Home");
  return;
 }
 try{
  await loadAccount(user);
  showPage(currentPage);
 }catch(e){status("Could not load account: "+e.message)}
});

showPage("Home");
</script>
</body>
</html>
