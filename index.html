
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BloxGo</title>
<style>
body{margin:0;background:#081321;color:#fff;font:16px Arial}header,nav,.card,.panel{background:#12233a;padding:15px}header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}nav{display:flex;gap:6px;flex-wrap:wrap}button{background:#167cff;color:white;border:0;border-radius:7px;padding:10px;margin:3px;cursor:pointer}input{padding:11px;margin:5px 0;background:#091729;color:white;border:1px solid #345;border-radius:7px}main{padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.card{border-radius:10px}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover}.face{width:100%;height:120px;object-fit:contain}.muted{color:#9db4d1}
</style>
</head>
<body>
<header><b>BloxGo</b><span><img width="22" src="Content/Icons/Robux_Icon.png" alt="Robux"> <span id="r">100</span>　<img width="22" src="Content/Icons/Tix.png" alt="Tix"> <span id="t">25</span></span></header>
<nav id="nav"></nav><main id="app"></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const fb=initializeApp({apiKey:"AIzaSyBui_UWCNABfF3wBYBMzi6Q5dLGvykfhaM",authDomain:"bloxgo-data.firebaseapp.com",projectId:"bloxgo-data",storageBucket:"bloxgo-data.firebasestorage.app",messagingSenderId:"905482130911",appId:"1:905482130911:web:273e391163a595ca32606a"});
const auth=getAuth(fb),db=getFirestore(fb),$=id=>document.getElementById(id);
const faces=[{id:"smile",name:"Smile",image:"Content/Faces/smile.png",price:0},{id:"epicface",name:"Epic Face",image:"Content/Faces/epicface.png",price:79}];
let s;try{s=JSON.parse(localStorage.bgState)}catch{}
s={r:100,t:25,owned:[],face:"smile",welcome:false,daily:"",...(s||{})};
let user=null,username="",games=[],mode="login";
const save=()=>{localStorage.bgState=JSON.stringify(s);$("r").textContent=s.r;$("t").textContent=s.t};
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const path=x=>x.split("/").map(encodeURIComponent).join("/");
const names=["Games","Servers","Catalog","Inventory","Avatar","Earn","Exchange","Account"];
$("nav").innerHTML=names.map(x=>`<button data-p="${x}">${x}</button>`).join("")+`<button id="refresh">Refresh</button>`;
$("nav").onclick=e=>{let p=e.target.dataset.p;if(p)show(p);if(e.target.id==="refresh")loadGames()};
function show(p){$("app").dataset.page=p;$("nav").querySelectorAll("button").forEach(b=>b.style.opacity=b.dataset.p===p?1:.7);({Games:renderGames,Servers:servers,Catalog:catalog,Inventory:inventory,Avatar:avatar,Earn:earn,Exchange:exchange,Account:account}[p]||renderGames)()}
async function loadGames(){try{let r=await fetch("games.json");if(!r.ok)throw 0;games=await r.json();renderGames()}catch{$("app").innerHTML="<h1>Games</h1><p>Could not load games.json.</p>"}}
function renderGames(){ $("app").innerHTML=`<h1>Games</h1><input id="search" placeholder="Search games"><div class="grid" id="list"></div>`;const draw=()=>{$("list").innerHTML=games.filter(g=>g.name.toLowerCase().includes($("search").value.toLowerCase())).map(g=>`<div class="card"><img class="thumb" src="Games/${path(g.folder)}/thumbnail.png" alt="${esc(g.name)}"><h3>${esc(g.name)}</h3><button onclick="location.href='Games/${path(g.folder)}/index.html'">Play</button></div>`).join("")||"No games found"};$("search").oninput=draw;draw()}
function catalog(){$("app").innerHTML="<h1>Catalog</h1><div class=grid>"+faces.map(f=>`<div class=card><img class=face src="${f.image}" alt="${f.name}"><h3>${f.name}</h3><p>${f.price} Robux</p><button onclick="buy('${f.id}')">${s.owned.includes(f.id)?"Owned":f.price?"Buy":"Get Free"}</button></div>`).join("")+"</div>"}
window.buy=id=>{let f=faces.find(x=>x.id===id);if(s.owned.includes(id))return alert("Already owned.");if(s.r<f.price)return alert("Not enough Robux.");s.r-=f.price;s.owned.push(id);save();catalog()};
function inventory(){$("app").innerHTML="<h1>Inventory</h1><div class=grid>"+faces.filter(f=>s.owned.includes(f.id)).map(f=>`<div class=card><img class=face src="${f.image}" alt="${f.name}"><h3>${f.name}</h3><button onclick="wear('${f.id}')">${s.face===f.id?"Equipped":"Wear"}</button></div>`).join("")+"</div>"}
window.wear=id=>{s.face=id;save();inventory()};
function avatar(){let f=faces.find(x=>x.id===s.face)||faces[0];$("app").innerHTML=`<h1>Avatar</h1><div class=panel><img class=face src="${f.image}" alt="${f.name}"><h3>${f.name}</h3><button onclick="show('Inventory')">Inventory</button></div>`}
function earn(){$("app").innerHTML=`<h1>Earn</h1><button onclick="reward()">Claim Welcome Reward</button><button onclick="daily()">Claim Daily Reward</button><p>Rewards are stored on this device.</p>`}
window.reward=()=>{if(s.welcome)return alert("Already claimed.");s.welcome=true;s.t+=25;save();earn()};
window.daily=()=>{let d=new Date().toISOString().slice(0,10);if(s.daily===d)return alert("Already claimed today.");s.daily=d;s.t+=10;save();earn()};
function exchange(){$("app").innerHTML=`<h1>Exchange</h1><p>${s.t} Tix to ${Math.floor(s.t/10)*5} Robux</p><button onclick="convert()">Exchange 10 Tix for 5 Robux</button>`}
window.convert=()=>{if(s.t<10)return alert("Not enough Tix.");s.t-=10;s.r+=5;save();exchange()};
function servers(){let a;try{a=JSON.parse(localStorage.bgServers)||[]}catch{a=[]}$("app").innerHTML=`<h1>Servers</h1><input id="sn" placeholder="Server name"><input id="su" placeholder="Server URL"><button onclick="addServer()">Add Server</button><div class=grid>${a.map((x,i)=>`<div class=card><h3>${esc(x.n)}</h3><p>${esc(x.u)}</p><button onclick="connectServer(${i})">Connect</button><button onclick="removeServer(${i})">Delete</button></div>`).join("")}</div>`}
window.addServer=()=>{let a=JSON.parse(localStorage.bgServers||"[]");if(!$("sn").value.trim()||!$("su").value.trim())return alert("Enter a name and URL.");a.push({n:$("sn").value.trim(),u:$("su").value.trim()});localStorage.bgServers=JSON.stringify(a);servers()};
window.connectServer=i=>{let a=JSON.parse(localStorage.bgServers||"[]");try{let u=new URL(a[i].u);if(!["http:","https:"].includes(u.protocol))throw 0;open(u.href,"_blank","noopener")}catch{alert("Enter a valid web URL.")}};
window.removeServer=i=>{let a=JSON.parse(localStorage.bgServers||"[]");a.splice(i,1);localStorage.bgServers=JSON.stringify(a);servers()};

async function emailFor(n){let b=new TextEncoder().encode(n.toLowerCase()+"|bloxgo-username-v1"),h=await crypto.subtle.digest("SHA-256",b);return"u-"+[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")+"@users.bloxgo.invalid"}
function account(){$("app").innerHTML=`<h1>Account</h1>${user?`<p>Signed in as ${esc(username)}</p><button id=logout>Log Out</button>`:`<div class=panel><button id=login>Log In</button><button id=register>Create Account</button><form id=form><input id=un required minlength=3 maxlength=20 pattern="[A-Za-z0-9_]+" placeholder="Username"><input id=pw type=password required minlength=6 placeholder="Password"><button id=submit>Log In</button></form><p id=msg></p></div>`}`;if(user){$("logout").onclick=()=>signOut(auth);return}$("login").onclick=()=>{mode="login";$("submit").textContent="Log In"};$("register").onclick=()=>{mode="register";$("submit").textContent="Create Account"};$("form").onsubmit=async e=>{e.preventDefault();let n=$("un").value.trim(),p=$("pw").value;try{let em=await emailFor(n);if(mode==="register"){let c=await createUserWithEmailAndPassword(auth,em,p);await setDoc(doc(db,"users",c.user.uid),{username:n})}else await signInWithEmailAndPassword(auth,em,p)}catch(err){$("msg").textContent=err.code==="auth/email-already-in-use"?"Username already used.":err.code==="auth/invalid-credential"?"Incorrect username or password.":err.message}}}
onAuthStateChanged(auth,async u=>{user=u;username="";if(u){try{let d=await getDoc(doc(db,"users",u.uid));username=d.exists()?d.data().username:"Player"}catch{username="Player"}}if($("app").dataset.page==="Account")account()});
save();show("Games");loadGames();
</script>
</body>
</html>
