
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>BloxGo</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #101827;
      --panel: #19263a;
      --panel-hover: #223550;
      --blue: #1685ff;
      --text: #f4f7ff;
      --muted: #a9b8ce;
      --border: #2a3b54;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 16px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 25px;
      font-weight: 800;
      color: #62aaff;
    }

    .navigation {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-button, .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel-hover);
      color: var(--text);
    }

    .nav-button:hover, .action-button:hover {
      background: #304766;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
      flex-shrink: 0;
    }

    main {
      width: min(1100px, 100%);
      margin: auto;
      padding: 24px 18px;
    }

    h1 {
      margin-top: 0;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    .search {
      flex: 1;
      min-width: 180px;
      padding: 12px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .primary {
      background: var(--blue);
      border-color: var(--blue);
    }

    .primary:hover {
      background: #0871e5;
    }

    .status {
      color: var(--muted);
      margin: 18px 0;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
    }

    .game-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }

    .game-card img.thumbnail {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #223550;
    }

    .game-info {
      padding: 14px;
    }

    .game-info h3 {
      margin: 0 0 12px;
    }

    .game-info a {
      color: white;
      text-decoration: none;
    }

    .game-info .action-button {
      width: 100%;
    }

    .empty {
      padding: 24px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }

    .section {
      margin-top: 28px;
    }

    [hidden] {
      display: none !important;
    }

    footer {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">BloxGo</div>

    <nav class="navigation" aria-label="Main navigation">
      <button class="nav-button" id="gamesButton">
        <img class="nav-icon"
             src="Content/Icons/games_icon.png"
             alt="">
        Games
      </button>

      <button class="nav-button" id="serversButton">
        <img class="nav-icon"
             src="Content/Icons/servers_icon.png"
             alt="">
        Servers
      </button>

      <button class="nav-button" id="refreshButton">
        <img class="nav-icon"
             src="Content/Icons/refresh_icon.png"
             alt="">
        Refresh
      </button>
    </nav>
  </header>

  <main>
    <section id="gamesSection">
      <h1>Games</h1>
      <p>Discover and play games on BloxGo.</p>

      <div class="toolbar">
        <input
          class="search"
          id="searchInput"
          type="search"
          placeholder="Search games..."
          aria-label="Search games">

        <button class="action-button primary" id="reloadGames">
          <img class="nav-icon"
               src="Content/Icons/refresh_icon.png"
               alt="">
          Refresh Games
        </button>
      </div>

      <p class="status" id="gamesStatus" role="status">
        Loading Games...
      </p>

      <div class="games-grid" id="gamesGrid"></div>
    </section>

    <section class="section" id="serversSection" hidden>
      <h1>Servers</h1>
      <p>Connect to a supported game server.</p>

      <div class="toolbar">
        <input
          class="search"
          id="serverAddress"
          type="text"
          placeholder="Enter server address..."
          aria-label="Server address">

        <button class="action-button primary" id="connectServer">
          Connect
        </button>
      </div>

      <p class="status" id="serverStatus" role="status">
        Enter a server address to continue.
      </p>

      <p>
        Note: This is a server-address interface. Actual connections
        require a compatible game client or server API.
      </p>
    </section>
  </main>

  <footer>
    BloxGo — A community gaming platform
  </footer>

  <script>
    "use strict";

    const gamesGrid = document.getElementById("gamesGrid");
    const gamesStatus = document.getElementById("gamesStatus");
    const searchInput = document.getElementById("searchInput");

    const gamesSection = document.getElementById("gamesSection");
    const serversSection = document.getElementById("serversSection");

    let allGames = [];

    function showSection(section) {
      gamesSection.hidden = section !== "games";
      serversSection.hidden = section !== "servers";
    }

    document.getElementById("gamesButton").addEventListener("click", () => {
      showSection("games");
    });

    document.getElementById("serversButton").addEventListener("click", () => {
      showSection("servers");
    });

    function createGameCard(game) {
      const card = document.createElement("article");
      card.className = "game-card";

      const thumbnail = document.createElement("img");
      thumbnail.className = "thumbnail";
      thumbnail.alt = "";
      thumbnail.loading = "lazy";

      const folder = String(game.folder || game.name || "");
      const thumbnailPath = game.thumbnail || "thumbnail.png";

      thumbnail.src = game.thumbnail
        ? thumbnailPath
        : "Games/" + encodeURIComponent(folder).replace(/%2F/gi, "/")
          + "/" + thumbnailPath;

      thumbnail.addEventListener("error", () => {
        thumbnail.hidden = true;
      }, { once: true });

      const info = document.createElement("div");
      info.className = "game-info";

      const title = document.createElement("h3");
      title.textContent = game.name || "Untitled Game";

      const play = document.createElement("a");
      play.className = "action-button primary";
      play.textContent = "Play";

      if (game.url) {
        play.href = game.url;
      } else {
        play.href = "Games/"
          + encodeURIComponent(folder).replace(/%2F/gi, "/")
          + "/index.html";
      }

      info.append(title, play);
      card.append(thumbnail, info);

      return card;
    }

    function renderGames() {
      const query = searchInput.value.trim().toLowerCase();

      const filteredGames = allGames.filter(game =>
        String(game.name || "").toLowerCase().includes(query)
      );

      gamesGrid.replaceChildren();

      if (filteredGames.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = allGames.length
          ? "No games match your search."
          : "No games found. Check games.json.";
        gamesGrid.append(empty);
        return;
      }

      filteredGames.forEach(game => {
        gamesGrid.append(createGameCard(game));
      });
    }

    async function loadGames() {
      gamesStatus.textContent = "Loading Games...";
      gamesGrid.replaceChildren();

      try {
        const response = await fetch("games.json", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Could not load games.json (" + response.status + ")");
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error("games.json must contain a JSON array.");
        }

        allGames = data;
        renderGames();

        gamesStatus.textContent = allGames.length
          ? allGames.length + " game(s) available."
          : "No games found.";
      } catch (error) {
        allGames = [];
        renderGames();
        gamesStatus.textContent =
          "Could not load games. Check your GitHub Pages URL and games.json.";
        console.error("BloxGo games loading error:", error);
      }
    }

    searchInput.addEventListener("input", renderGames);

    document.getElementById("refreshButton")
      .addEventListener("click", loadGames);

    document.getElementById("reloadGames")
      .addEventListener("click", loadGames);

    document.getElementById("connectServer").addEventListener("click", () => {
      const address = document.getElementById("serverAddress").value.trim();
      const status = document.getElementById("serverStatus");

      if (!address) {
        status.textContent = "Please enter a server address.";
        return;
      }

      status.textContent =
        "Server address saved for this session: " + address
        + ". A compatible connection service is required to join.";
    });

    loadGames();
  </script>
</body>
</html>
