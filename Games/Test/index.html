
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jump Master</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#1689f8;color:white;touch-action:none}
canvas{display:block;width:100vw;height:100dvh}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:2}
.panel{background:#073775dd;padding:10px 14px;border-radius:15px;font-weight:bold;font-size:17px}
#exitButton{position:absolute;top:70px;left:12px;padding:10px 15px;border:2px solid white;border-radius:12px;background:#073775;color:white;font-weight:bold;font-size:15px;z-index:5}
#buttons{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;z-index:2}
.control{border:2px solid #ffffffbb;background:#0754a9aa;color:white;border-radius:50%;width:65px;height:65px;font-size:27px;font-weight:bold;touch-action:none}
#jump{width:85px;height:85px;font-size:35px}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#001c4a99;z-index:10;pointer-events:auto}
.box{position:relative;z-index:11;text-align:center;background:#083b78;padding:26px;border:2px solid #70d9ff;border-radius:24px;width:min(85%,340px);pointer-events:auto}
h1{font-size:34px;margin:0 0 12px;color:#ffe84c}
#start{position:relative;z-index:12;border:0;border-radius:14px;padding:15px 28px;background:#15b8ff;color:white;font-size:20px;font-weight:bold;cursor:pointer;touch-action:manipulation;pointer-events:auto}
.small{opacity:.8;font-size:14px}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="panel">🪙 Score: <span id="score">0</span></div>
  <div class="panel">🏆 Best: <span id="best">0</span></div>
</div>

<button id="exitButton">⬅ Exit</button>

<div id="buttons">
  <div>
    <button class="control" id="left">◀</button>
    <button class="control" id="right">▶</button>
  </div>
  <button class="control" id="jump">⬆</button>
</div>

<div id="overlay">
  <div class="box">
    <h1>JUMP MASTER</h1>
    <p>Collect coins and avoid bombs!</p>
    <p id="result">Your best score: 0</p>
    <button id="start" type="button">PLAY!</button>
    <p class="small">Move and jump to survive!</p>
  </div>
</div>

<script>
const c=document.getElementById('game');
const ctx=c.getContext('2d');
const scoreEl=document.getElementById('score');
const bestEl=document.getElementById('best');
const overlay=document.getElementById('overlay');
const result=document.getElementById('result');
const startButton=document.getElementById('start');

let W,H,scale,player,items,score;
let best=0,running=false;
let left=false,right=false,frame=0,speed=3,last=0;

try{best=Number(localStorage.getItem('jumpmaster_best'))||0}catch(e){}
bestEl.textContent=best;

function resize(){
  scale=window.devicePixelRatio||1;
  W=innerWidth;H=innerHeight;
  c.width=W*scale;c.height=H*scale;
  ctx.setTransform(scale,0,0,scale,0,0);
}
addEventListener('resize',resize);
resize();

document.getElementById('exitButton').addEventListener('click',()=>{
  window.location.href='../../index.html';
});

function reset(){
  if(running)return;
  player={x:W*.2,y:H*.65,w:34,h:38,vy:0,ground:false};
  items=[];
  score=0;
  frame=0;
  speed=3;
  last=0;
  left=false;
  right=false;
  scoreEl.textContent='0';
  result.textContent='Collect coins and avoid bombs!';
  startButton.textContent='PLAY!';
  running=true;
  overlay.style.display='none';
}

function spawn(){
  const bomb=Math.random()<.25;
  items.push({
    x:W+30,
    y:H*.57+Math.random()*H*.17,
    r:bomb?17:13,
    bomb,
    taken:false
  });
}

function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1685f8');
  g.addColorStop(1,'#83e6ff');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<8;i++){
    let x=((i*125-frame*.25)%(W+140)+W+140)%(W+140);
    ctx.fillStyle='#ffffff30';
    ctx.beginPath();
    ctx.arc(x,H*.22+i%3*35,25,0,7);
    ctx.fill();
  }

  ctx.fillStyle='#1783c5';
  ctx.fillRect(0,H*.83,W,H*.17);
  ctx.fillStyle='#41d878';
  ctx.fillRect(0,H*.82,W,12);
}

function drawPlayer(){
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.fillStyle='#062d67';
  ctx.fillRect(-3,-3,40,44);
  ctx.fillStyle='#f6fcff';
  ctx.fillRect(0,0,34,38);
  ctx.fillStyle='#073775';
  ctx.fillRect(8,10,5,12);
  ctx.fillRect(22,10,5,12);
  ctx.restore();
}

function endGame(){
  if(!running)return;
  running=false;

  if(score>best){
    best=score;
    bestEl.textContent=best;
    try{localStorage.setItem('jumpmaster_best',best)}catch(e){}
  }

  result.textContent='Game Over! Score: '+score+' | Best: '+best;
  startButton.textContent='PLAY AGAIN';
  overlay.style.display='flex';
}

function loop(t){
  requestAnimationFrame(loop);

  const dt=Math.min((t-(last||t))/16.67,2);
  last=t;
  drawBackground();

  if(!running)return;

  frame+=dt;
  if(frame>48){
    spawn();
    frame=0;
    speed=Math.min(7,speed+.025);
  }

  player.vy+=.65*dt;
  player.y+=player.vy*dt;

  if(player.y+player.h>H*.82){
    player.y=H*.82-player.h;
    player.vy=0;
    player.ground=true;
  }else{
    player.ground=false;
  }

  if(left)player.x-=4*dt;
  if(right)player.x+=4*dt;
  player.x=Math.max(0,Math.min(W-player.w,player.x));

  for(const it of items){
    it.x-=speed*dt;

    if(!it.taken&&
       Math.abs(it.x-player.x-player.w/2)<it.r+17&&
       Math.abs(it.y-player.y-player.h/2)<it.r+20){
      if(it.bomb){
        endGame();
        break;
      }
      it.taken=true;
      score++;
      scoreEl.textContent=score;
    }

    ctx.beginPath();
    ctx.arc(it.x,it.y,it.r,0,Math.PI*2);
    ctx.fillStyle=it.bomb?'#ff385b':'#ffcf24';
    ctx.fill();
    ctx.strokeStyle=it.bomb?'#b50032':'#fff27b';
    ctx.lineWidth=4;
    ctx.stroke();
    ctx.fillStyle='white';
    ctx.font='bold 17px Arial';
    ctx.textAlign='center';
    ctx.fillText(it.bomb?'!':'$',it.x,it.y+6);
  }

  items=items.filter(it=>it.x>-40&&!it.taken);
  drawPlayer();
}

function bind(id,down,up){
  const b=document.getElementById(id);

  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    down();
  });

  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{
    b.addEventListener(ev,()=>up());
  });
}

bind('left',()=>left=true,()=>left=false);
bind('right',()=>right=true,()=>right=false);

bind('jump',()=>{
  if(running&&player.ground){
    player.vy=-13;
    player.ground=false;
  }
},()=>{});

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))
    e.preventDefault();

  if(e.key==='ArrowLeft'||e.key==='a')left=true;
  if(e.key==='ArrowRight'||e.key==='d')right=true;

  if((e.key==='ArrowUp'||e.key===' ')&&running&&player.ground){
    player.vy=-13;
    player.ground=false;
  }
});

document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')left=false;
  if(e.key==='ArrowRight'||e.key==='d')right=false;
});

startButton.addEventListener('click',reset);

startButton.addEventListener('pointerup',e=>{
  e.preventDefault();
  reset();
});

requestAnimationFrame(loop);
</script>
</body>
</html>
